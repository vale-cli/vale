StylesPath = ../../styles
MinAlertLevel = suggestion

[formats]
py = md

[*.json]
BasedOnStyles = Vale, Scopes

View = GitHubActions

[*.java]
vale.Annotations = YES

View = Strings

[*.py]
vale.Annotations = YES

View = Python

[*.{yml,yaml}]
BasedOnStyles = Vale, Scopes

[API.yml]
View = OpenAPI

[Petstore.yaml]
View = Petstore

[Rule.yml]
View = Vale

[newline.yml]
View = NewLine

[issue1018.yml]
View = Issue1018

[ansible.yml]
BasedOnStyles = Vale, Scopes

View = Ansible

[COMMIT_EDITMSG]
BasedOnStyles = Vale, Scopes

View = Commit

[transcript.txt]
BasedOnStyles = Vale, Scopes

View = Transcript
