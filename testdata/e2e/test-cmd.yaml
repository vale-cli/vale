# `vale test`: the cases a configuration keeps beside its rules.
#
# See #1122. The command lints each case's `input` in process, so these
# scenarios are about the contract -- discovery, assertions, exit status --
# rather than about any one rule.
name: test-cmd

# Every case starts from the same small style, then writes the test file it
# needs. The rule is deliberately dull: what's under test is the runner.
files:
  .vale.ini: |
    StylesPath = styles
    MinAlertLevel = suggestion

    [*.md]
    BasedOnStyles = T
  styles/T/Weasel.yml: |
    extends: existence
    message: "'%s' is a weasel word!"
    level: warning
    ignorecase: true
    tokens:
      - really
      - very

cases:
  - name: passing
    about: "the three assertions, plus `rule:` for a case that loads nothing
      but the rule it names"
    files:
      styles/T/Weasel.test.yml: |
        - name: flags a weasel word
          input: |
            We really need this.
          want: |
            1:4:T.Weasel:'really' is a weasel word!

        - name: plain prose stays silent
          input: We need this.
          want: ""

        - name: fires, message not pinned
          input: This is very important.
          contains: T.Weasel

        - name: never fires inside a fence
          input: |
            ```
            really
            ```
          absent:
            - T.Weasel

        - name: the rule alone, no configuration
          rule: Weasel.yml
          input: We really need this.
          want: |
            1:4:T.Weasel:'really' is a weasel word!
    args: test
    exit: 0
    contains: 5 passed, 0 failed

  - name: failing
    about: a failed case reports the diff and exits 1, which is what CI reads
    files:
      styles/T/Weasel.test.yml: |
        - name: wrong column
          input: |
            We really need this.
          want: |
            1:9:T.Weasel:'really' is a weasel word!
    args: test
    exit: 1
    contains: |
      - 1:9:T.Weasel:'really' is a weasel word!
          + 1:4:T.Weasel:'really' is a weasel word!

  - name: a test file is not a rule
    about: "`Weasel.test.yml` sits in the StylesPath, and loading it as a rule
      failed the whole configuration on its missing `extends`"
    files:
      styles/T/Weasel.test.yml: |
        - name: flags a weasel word
          input: We really need this.
          contains: T.Weasel
      test.md: |
        We really need this.
    args: test.md
    exit: 0
    want: |
      test.md:1:4:T.Weasel:'really' is a weasel word!

  - name: format
    about: "a case is linted as Markdown unless it says otherwise -- and
      `format` is read against the project's globs, so a case in a format the
      configuration doesn't cover sees no rules at all, exactly as a file in
      that format would"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.{md,rst}]
        BasedOnStyles = T
      styles/T/Weasel.test.yml: |
        - name: linted as reStructuredText
          format: rst
          input: |
            A really important line.
          contains: T.Weasel

        - name: the same text as Markdown
          input: |
            A really important line.
          contains: T.Weasel

        - name: a format the configuration does not cover
          format: txt
          input: |
            A really important line.
          want: ""
    args: test
    requires: [rst2html]
    exit: 0
    contains: 3 passed, 0 failed

  - name: view
    about: "`view:` reads an isolated case through a View, so a rule scoped to
      a part of a file with no markup keeps its cases beside it"
    files:
      styles/config/views/Commit.yml: |
        engine: textfsm
        template: |
          Value Subject (.+)
          Value List Body (.*)

          Start
            ^${Subject} -> Body

          Body
            ^${Body}
        scopes:
          - name: subject
            expr: Subject
          - name: body
            expr: Body
      styles/T/Period.yml: |
        extends: existence
        message: "A subject does not end with a period."
        level: error
        scope: subject
        nonword: true
        raw:
          - '\.$'
        tests:
          - name: fires on the subject
            format: COMMIT_EDITMSG
            view: Commit
            input: |
              Fix the thing.

              The body ends with a period too.
            want: |
              1:14:T.Period:A subject does not end with a period.

          - name: never on the body
            format: COMMIT_EDITMSG
            view: Commit
            input: |
              Fix the thing

              A body line ending with a period.
            want: ""

          - name: without the view there is no subject
            format: COMMIT_EDITMSG
            input: |
              Fix the thing.
            want: ""
    args: test styles/T/Period.yml
    exit: 0
    contains: |
      3 passed, 0 failed

  - name: view not found
    files:
      styles/T/Period.yml: |
        extends: existence
        message: "A subject does not end with a period."
        level: error
        scope: subject
        raw:
          - '\.$'
        tests:
          - name: fires
            view: Missing
            input: Fix the thing.
            contains: T.Period
    args: test styles/T/Period.yml
    exit: 2
    contains: |
      view 'Missing' not found under config/views on the search path

  - name: no cases found
    about: an empty run is a mistake worth reporting, not a pass
    files:
      README.md: |
        Nothing to test here.
    args: test
    exit: 2
    contains: no test cases found

  - name: a case has to assert something
    about: "a case with no `want`, `contains` or `absent` reads as coverage
      while testing nothing"
    files:
      styles/T/Weasel.test.yml: |
        - name: asserts nothing
          input: We really need this.
    args: test
    exit: 2
    contains: needs one of

  - name: coverage
    about: "`--coverage` lists the rules under the given paths that no case
      made fire. A rule matching nothing loads, runs, and passes a case that
      wants nothing, so the run fails until some case shows it working."
    files:
      styles/T/Weasel.test.yml: |
        - name: flags a weasel word
          input: We really need this.
          want: |
            1:4:T.Weasel:'really' is a weasel word!
      styles/T/Silent.yml: |
        extends: existence
        message: "'%s' is banned."
        level: warning
        tokens:
          - nowhere

        tests:
          - name: never fires
            input: Plain prose.
            want: ""
    args: test --coverage styles
    exit: 1
    contains: |
      ✗ 1 rule produced no alert in any case

          T.Silent

  - name: coverage-json
    about: the JSON report carries the same list under `uncovered`
    files:
      styles/T/Silent.yml: |
        extends: existence
        message: "'%s' is banned."
        level: warning
        tokens:
          - nowhere

        tests:
          - name: never fires
            input: Plain prose.
            want: ""
    args: test --coverage --output=JSON styles
    exit: 1
    contains: |
      "uncovered": [
              "T.Silent",
              "T.Weasel"
          ]

  - name: package dependencies
    about: "a package's own `.vale.ini` names what its rules extend, and the
      run installs it -- here a local Base -- so the cases resolve without a
      synced project"
    files:
      Mine/.vale.ini: |
        Packages = deps/Base

        [*.md]
        BasedOnStyles = Mine
      Mine/styles/Mine/Hedge.yml: |
        extends: Base.Words
        message: "Don't hedge with '%s'."
        tests:
          - name: inherits the parent's tokens
            input: It might work.
            want: |
              1:4:Mine.Hedge:Don't hedge with 'might'.
      deps/Base/Words.yml: |
        extends: existence
        message: "'%s'"
        level: warning
        tokens:
          - might
    args: test Mine
    exit: 0
    contains: 1 passed, 0 failed

  - name: a case that cannot run
    about: "a broken rule fails its own cases and the rest still report; the
      run exits 2, since the configuration is what's broken"
    files:
      styles/T/Broken.yml: |
        extends: Missing.Parent
        message: "x"
        tests:
          - name: never loads
            input: Text.
            contains: T.Broken
      styles/T/Good.yml: |
        extends: existence
        message: "'%s'"
        tokens:
          - truly
        tests:
          - name: loads alone
            input: It truly is.
            contains: T.Good
    args: test styles
    exit: 2
    contains: |
      1 passed, 1 failed

  - name: a rule's cases that don't parse
    about: "an unquoted `input: Note: this` broke the YAML, and the file was
      skipped as foreign, so its cases vanished from the run unannounced"
    files:
      styles/T/Colon.yml: |
        extends: existence
        message: "'%s'"
        tokens:
          - really
        tests:
          - name: never parses
            input: Note: really
            contains: T.Colon
    args: --output=line test styles/T/Colon.yml
    exit: 2
    contains: |
      styles/T/Colon.yml:7:E201:mapping values are not allowed in this context

  - name: foreign YAML that doesn't parse
    about: "a file that isn't a rule with cases is still skipped, even with an
      `extends` of its own"
    files:
      .eslintrc.yml: |
        extends: recommended
        rules:
          bad: [
      styles/T/Weasel.test.yml: |
        - name: flags a weasel word
          input: We really need this.
          contains: T.Weasel
    args: test
    exit: 0
    contains: 1 passed, 0 failed

  - name: sequence-tags
    about: "a failing case of a `sequence` rule shows the input as tagged,
      since the tags are what the rule matched and the YAML never shows them"
    files:
      styles/T/Adjectives.yml: |
        extends: sequence
        message: "Two adjectives in a row: '%s'."
        level: warning
        tokens:
          - tag: JJ
          - tag: JJ
      styles/T/Adjectives.test.yml: |
        - name: expects a match that is not there
          rule: Adjectives.yml
          input: The old house.
          want: |
            1:5:T.Adjectives:Two adjectives in a row: 'old'.
    args: test styles/T/Adjectives.test.yml
    exit: 1
    contains: |
      tags  The/DT old/JJ house/NN ./.

  - name: lang-needs-rule
    about: "`lang` is for an isolated case; a project case takes its language
      from the project's sections"
    files:
      styles/T/Weasel.test.yml: |
        - name: a project case in German
          lang: de
          input: Wir brauchen das wirklich.
          want: ""
    args: test styles/T/Weasel.test.yml
    exit: 2
    contains: |
      `lang` needs `rule`
