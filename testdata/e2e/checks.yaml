# One case per check type.
name: checks
dir: fixtures/checks

cases:
  - name: script
    dir: Script
    args: .
    exit: 0
    want: |
      test.md:1:2:Scripts.CustomMsg:Some message
      test.md:29:1:Checks.ScriptRE:Consider inserting a new section heading at this point.
      test.md:39:1:Checks.ScriptRE:Consider inserting a new section heading at this point.

  - name: metric
    dir: Metric
    args: .
    exit: 0
    want: |
      test.md:1:1:Checks.MetricValue:This topic has 1.00 H2s in it.

  - name: conditional
    dir: Conditional
    args: .
    exit: 1
    want: |
      test.md:9:5:Checks.MultiCapture:'NFL' has no definition

  - name: conditional-presence
    about: "#1048"
    dir: ConditionalPresence
    args: .
    exit: 1
    want: |
      missing.md:1:3:Test.Presence:A 'Section' requires a 'Summary:' line.

  - name: occurrence
    dir: Occurrence
    args: .
    exit: 1
    want: |
      test.md:1:1:demo.ZeroOccurrence:No intro
      test.md:1:3:demo.MinCount:Content too short (1).
      test2.md:1:3:demo.MinCount:Content too short (3).
      test3.md:7:37:demo.CharCount:Topic titles should use fewer than 70 characters.
      test3.md:11:4:demo.CharCount:Topic titles should use fewer than 70 characters.
      test3.md:27:6:demo.CharCount:Topic titles should use fewer than 70 characters.

  - name: occurrence-count-verbs
    about: "#1199 -- the count fills `%s` or `%d`, whichever the message
      uses, including when it is zero"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/Few.yml: |
        extends: occurrence
        message: "Found %s apple(s); need at least 2."
        level: error
        scope: text
        min: 2
        token: apple
      styles/T/Many.yml: |
        extends: occurrence
        message: "Found %d pear(s); at most 1 allowed."
        level: error
        scope: text
        max: 1
        token: pear
      styles/T/None.yml: |
        extends: occurrence
        message: "No plum (%s found)."
        level: error
        scope: text
        min: 1
        token: plum
      test.md: |
        One apple, a pear, and a pear.
    args: test.md
    exit: 1
    want: |
      test.md:1:1:T.None:No plum (0 found).
      test.md:1:5:T.Few:Found 1 apple(s); need at least 2.
      test.md:1:14:T.Many:Found 2 pear(s); at most 1 allowed.

  - name: sentence-case
    dir: SentenceCase
    args: .
    exit: 0
    want: |
      test.html:6:13:demo.SentenceCase:'Something Weird is happening With Vale With Entities' should be sentence-cased
      test.md:5:3:demo.SentenceCase:'this isn't in sentence case' should be sentence-cased
      test.md:11:3:demo.SentenceCase:'This Does Not Comply' should be sentence-cased

  - name: repetition
    dir: Repetition
    args: .
    requires: rst2html
    exit: 1
    want: |
      test.md:5:170:Vale.Repetition:'plan' is repeated!
      test.md:21:27:Vale.Repetition:'a' is repeated!
      test.md:23:56:Vale.Repetition:'completes' is repeated!
      test.md:25:130:Vale.Repetition:'registry' is repeated!
      test.md:27:9:Vale.Repetition:'Mermaid' is repeated!
      test.md:29:17:Vale.Repetition:'one' is repeated!
      test.md:31:6:Vale.Repetition:'to' is repeated!
      test.md:35:12:Vale.Repetition:'use' is repeated!
      text.rst:6:17:Vale.Repetition:'as' is repeated!
      text.rst:8:33:Vale.Repetition:'the' is repeated!
      text.rst:15:7:Vale.Repetition:'and' is repeated!
      text.rst:16:22:Vale.Repetition:'on' is repeated!
      text.rst:19:1:Vale.Repetition:'this' is repeated!
      text.rst:20:13:Vale.Repetition:'be' is repeated!

  - name: capitalization
    dir: Capitalization
    args: .
    exit: 1
    want: |
      test2.md:1:3:demo.CustomCap:'Section about the MacBook pro ultimate edition' should be in title case
      test4.md:9:4:demo.SentenceCase:'An unimportant Heading' should be sentence-cased
      test4.md:15:4:demo.SentenceCase:'B. An unimportant heading' should be sentence-cased

  - name: spelling
    dir: Spelling
    args: .
    exit: 1
    want: |
      test.md:16:1:Vale.Spelling:Use 'GitLab' instead of 'gitlab'.
      test.md:28:11:Vale.Spelling:Did you really mean 'typpo'?
      test.md:32:17:Vale.Spelling:Did you really mean 'gfm'?
      test.md:34:17:Vale.Spelling:Did you really mean 'remmark'?

  - name: spelling-break-rules
    about: "#1165 -- a dictionary's BREAK rules split a word, so `foo-bar`
      passes when both pieces do; a piece that fails still reports the word"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = error

        [*.md]
        BasedOnStyles = Break
      styles/Break/Spelling.yml: |
        extends: spelling
        message: "'%s' is not recognized."
        level: error
        custom: true
        dictionaries:
          - break
      styles/config/dictionaries/break.aff: |
        SET UTF-8

        BREAK 1
        BREAK -

        WORDCHARS -
      styles/config/dictionaries/break.dic: |
        2
        foo
        bar
      input.md: |
        foo

        bar

        foo-bar

        foo-qux
    args: input.md
    exit: 1
    want: |
      input.md:7:1:Break.Spelling:'foo-qux' is not recognized.

  - name: existence
    dir: Existence
    args: .
    exit: 1
    want: |
      test.md:3:6:write-good.E-Prime:Avoid using "is"
      test.md:7:4:write-good.E-Prime:Avoid using "Here's"
      test.md:9:6:write-good.E-Prime:Avoid using "is"
      test.md:9:28:vale.Spacing:Use exactly one space between sentences and clauses. Check 'e.A' for spacing problems.

  - name: existence-wrapped-line
    about: "#1185 -- a token that spans a line break matches the same in a
      paragraph, a list item, and a blockquote: the source's indentation and
      quote markers after the break do not keep the alert from being placed."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/Phrase.yml: |
        extends: existence
        message: "found '%s'"
        level: warning
        tokens:
          - 'the\s+old\s+model'
      wrap.md: |
        Paragraph: this is the old
        model here.

        - Bullet: this is the old
          model here.

        > Quote: this is the old
        > model here.

        1. Numbered: this is the old
           model here.
    args: wrap.md
    exit: 0
    want: |
      wrap.md:1:20:T.Phrase:found 'the old model'
      wrap.md:4:19:T.Phrase:found 'the old model'
      wrap.md:7:18:T.Phrase:found 'the old model'
      wrap.md:10:22:T.Phrase:found 'the old model'

  - name: existence-link-only-paragraph
    about: "#1186 -- a paragraph that opens with inline content is placed at
      its own source text, not at the next place the same text follows a
      space; a later repeat of the match is reported as well as the first."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/Phrase.yml: |
        extends: existence
        message: "found '%s'"
        level: warning
        tokens:
          - 'the\s+old\s+model'
          - legacy
      drop.md: |
        [the old model](https://example.com/)

        Later the old model again.
      drop2.md: |
        Earlier the old model in prose.

        [the old model](https://example.com/)
      fm.md: |
        ---
        title: The legacy title
        description: A legacy description.
        ---

        Body.
    args: .
    exit: 0
    want: |
      drop.md:1:2:T.Phrase:found 'the old model'
      drop.md:3:7:T.Phrase:found 'the old model'
      drop2.md:1:9:T.Phrase:found 'the old model'
      drop2.md:3:2:T.Phrase:found 'the old model'
      fm.md:2:12:T.Phrase:found 'legacy'
      fm.md:3:16:T.Phrase:found 'legacy'

  - name: existence-raw-percent
    about: "a raw pattern is joined into a printf template, so a `%` in it
      was read as a verb and the rule never matched"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = Pct
      styles/Pct/Sign.yml: |
        extends: existence
        message: "Write 'percent', not '%s'."
        level: error
        nonword: true
        raw:
          - '%'
      styles/Pct/Placeholder.yml: |
        extends: existence
        message: "Placeholder '%s' left in text."
        level: warning
        nonword: true
        raw:
          - '%[sd]'
      test.md: |
        Save %s files. A 50% discount.
    args: test.md
    exit: 1
    want: |
      test.md:1:6:Pct.Placeholder:Placeholder '%s' left in text.
      test.md:1:6:Pct.Sign:Write 'percent', not '%'.
      test.md:1:20:Pct.Sign:Write 'percent', not '%'.

  - name: raw-caret-past-1k
    about: "#869"
    dir: RawCaret
    args: .
    exit: 1
    want: |
      test.md:26:1:Test.Indent:Bad indent "   `"

  - name: display-math
    about: "#878"
    dir: Math
    args: .
    exit: 0
    want: |
      test.md:1:6:Test.Word:Found 'FOOBAR'.
      test.md:7:35:Test.Word:Found 'FOOBAR'.

  - name: heading-scope-with-sentence-rule
    about: "#1150 -- a `scope: heading` rule sees the whole heading, not its
      first sentence fragment, when a `scope: sentence` rule is also loaded;
      the sentence rule still reaches the heading's text"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/HeadPunct.yml: |
        extends: existence
        message: "Do not use '%s' at the end of headings"
        scope: heading
        level: warning
        raw:
          - '(?:\:|\.)$'
      styles/T/SentHit.yml: |
        extends: existence
        message: "found '%s' in a sentence"
        level: warning
        scope: sentence
        tokens:
          - lettered
      test.md: |
        # Title

        ### a. Parent lettered heading

        ### b. Sibling heading
    args: test.md
    exit: 0
    want: |
      test.md:3:15:T.SentHit:found 'lettered' in a sentence

  - name: occurrence-sentence-anchor
    about: "#1147 -- a sentence-scoped `occurrence` alert anchors to its own
      sentence. The flagged sentence starts with `Replace` one space before a
      code span, and a later bullet reuses the word: treating space-then-backtick
      as inline markup handed the alert to the bullet"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/SentenceLength.yml: |
        extends: occurrence
        message: "Try to keep sentences short (< 30 words)."
        scope: sentence
        level: warning
        max: 30
        token: '\b(\w+)\b'
      test.md: |
        > The `format` option is read automatically (the loader resolves it at startup
        > level), so leave it as-is. Replace `<preset>` with a bare name (for example
        > `fast`) to select that preset's defaults (colors, spacing, and margins with no
        > other changes), or a full path (for example `./theme.json`) to load your own.

        - **Replace the renderer too.** Write the output yourself in a custom format.
    args: test.md
    exit: 0
    want: |
      test.md:2:30:T.SentenceLength:Try to keep sentences short (< 30 words).

  - name: occurrence-summary-anchor
    about: "#1191 -- a summary-scoped `occurrence` alert lands on the prose it
      counted. The summary holds neither front matter, code, nor headings, so a
      copy of the match in any of them is not what was counted; searching the
      file for the match text handed it the alert"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/Density.yml: |
        extends: occurrence
        message: "'finally' appears %d times"
        level: suggestion
        scope: summary
        max: 1
        token: 'finally'
      front.md: |
        ---
        summary: finally a value
        ---

        # Title

        It works finally. It stops finally.
      code.md: |
        # Title

        ```sh
        echo finally
        ```

        It works finally. It stops finally.
      heading.md: |
        # Finally, finally

        It works finally. It stops finally.
      list.md: |
        # Finally

        - It works finally.
        - It stops finally.
    args: --output=line front.md code.md heading.md list.md
    exit: 0
    want: |
      code.md:7:10:T.Density:'finally' appears 2 times
      front.md:7:10:T.Density:'finally' appears 2 times
      heading.md:3:10:T.Density:'finally' appears 2 times
      list.md:3:12:T.Density:'finally' appears 2 times

  - name: existence-eol-anchor
    about: "#892"
    dir: EndOfLine
    args: .
    exit: 0
    want: |
      test.md:1:15:Test.EOL:Avoid ending a line with 'and'.

  - name: substitution
    dir: Substitution
    args: .
    exit: 1
    want: |
      test.md:5:5:Bugs.Newline:Use 'test' rather than 'linuxptp'.
      test.md:8:5:Bugs.Newline:Use 'test' rather than 'linuxptp'.
      test.md:10:1:Bugs.URLCtx:Use 'Term' instead of 'term'
      test.md:15:29:Bugs.MatchCase:Consider using 'human kind' instead of 'mankind'.
      test.md:17:1:Bugs.MatchCase:Consider using 'Human kind' instead of 'Mankind'.
      test.md:17:14:Bugs.URLCtx:Use 'Term' instead of 'term'
      test.md:19:5:Bugs.KeepCase:Use 'mutual TLS' rather than Mutual TLS.
      test.md:19:36:Bugs.KeepCase:Use 'vNIC' rather than VNIC.
      test.md:21:1:Bugs.TermCase:Use 'JavaScript' rather than Javascript.
      test.md:21:53:Bugs.TermCase:Use 'JavaScript' rather than javascript.
      test.md:23:1:Bugs.TermCase:Use 'iOS' rather than IOS.
      test.md:25:1:Bugs.SameCase:Use 'MPL 2.0' instead of 'mpl 2.0'
      test.md:27:1:Bugs.SameCase:Use 'MPL 2.0' instead of 'MPL2.0'
      test.md:31:15:Bugs.EmptyReplace:Use  instead of 'obvious'.
      test.md:33:4:Bugs.Commas:Use a single comma or an ellipsis, not multiple consecutive commas.
      test.md:33:23:Bugs.Commas:Use a single comma or an ellipsis, not multiple consecutive commas.
      test2.md:3:1:demo.CapSub:Use 'Change to the `/etc` directory' instead of 'Change into the `/etc` directory'.
      test2.md:7:1:demo.CapSub:Use 'Change to the `/home/user` directory' instead of 'Change into the `/home/user` directory'.
      test2.md:9:1:demo.CapSub:Use 'Change to the `/etc/X11` directory' instead of 'Change into the `/etc/X11` directory'.
      test2.md:11:6:Bugs.WrongExp:Use 'versus' instead of 'vs '.

  - name: consistency
    about: "#1184"
    dir: Consistency
    args: .
    exit: 1
    want: |
      input.txt:1:3:Test.Quotes:Inconsistent quote style '”'
      input.txt:3:1:Test.Quotes:Inconsistent quote style '”'
