      test.md:13:10:T.Tail:Bare stop.

  - name: sequence-blocks
    dir: SequenceScopes
    args: .
    exit: 1
    want: |
      test.md:1:14:T.Seq:Sequence matched 'default'.
      test.md:3:12:T.Seq:Sequence matched 'default'.
      test.md:3:20:T.Seq:Sequence matched 'database'.
      test.md:5:15:T.Seq:Sequence matched 'default'.
      test.md:5:23:T.Seq:Sequence matched 'database'.
      test.md:7:14:T.Seq:Sequence matched 'default'.
      test.md:7:22:T.Seq:Sequence matched 'database'.
      test.md:9:14:T.Seq:Sequence matched 'default'.
      test.md:9:22:T.Seq:Sequence matched 'database'.
      test.md:13:14:T.Seq:Sequence matched 'default'.
      test.md:13:22:T.Seq:Sequence matched 'database'.

  - name: sequence-wrapped-repeat
    about: "#1203 -- a match that wraps into a list item's indented line, or
      a blockquote's quoted one, is placed at that block when the same words
      appear later without the indentation; it used to be placed on the later
      copy and merged with that copy's own alert"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = Demo
      styles/Demo/Passive.yml: |
        extends: sequence
        message: "Passive voice: %s"
        level: error
        tokens:
          - pattern: (?:is|was)
          - tag: VBN
      test.md: |
        - The item opens. The report was
          generated last night.

        > The quote opens. The report was
        > generated last night.

        The paragraph opens. The report was
        generated last night.
    args: test.md
    exit: 1
    want: |
      test.md:1:30:Demo.Passive:Passive voice: was
      test.md:4:31:Demo.Passive:Passive voice: was
      test.md:7:33:Demo.Passive:Passive voice: was

  - name: sequence/min
    about: "#899 -- `min` asks for repeated occurrences of a token, each with
      its own `skip` window: a pronoun preceded by two or more nouns, not
      just one. A token found inside its window also no longer excuses the
      tokens after it from matching."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        T.Ambiguous = YES
      styles/T/Ambiguous.yml: |
        extends: sequence
        message: "Avoid ambiguous pronouns."
        level: warning
        ignorecase: true
        tokens:
          - tag: NN|NNP|NNPS|NNS
            skip: 4
            min: 2
          - pattern: \w+
            tag: PRP
            target: true
      test.md: |
        The dog chased the cat until it tired.

        The dog barked because it hungered.

        Suddenly it stopped.
    args: test.md
    exit: 0
    want: |
      test.md:1:30:T.Ambiguous:Avoid ambiguous pronouns.

  - name: sequence-inline-markup
    about: "#1202 -- a sequence match holding inline markup is placed through
      the block's runs, at the same span an existence rule reports, instead
      of being searched for as rewritten text and falling back to the whole
      line; a repeated sentence places each match at its own position"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/Passive.yml: |
        extends: sequence
        message: "Passive: %s"
        level: error
        tokens:
          - pattern: (?:is|was)
          - tag: VBN
      styles/T/Exist.yml: |
        extends: existence
        message: "Existence: %s"
        level: error
        nonword: true
        tokens:
          - (?:is|was) \*{0,2}\w+ed\*{0,2}
      test.md: |
        The report is generated every night.

        Some words come first. Then the report is *generated* every night.

        Some words come first. Then the report is **generated** every night. The report is **generated** again.
    args: --output=JSON test.md
    exit: 1
    want: |
      {
        "test.md": [
          {
