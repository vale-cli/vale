  - name: skip
    args: .
    requires: rst2html
    exit: 0
    want: |
      test.md:3:1:vale.Annotations:'TODO' left in text
      test.rst:20:1:vale.Annotations:'TODO' left in text
      test.rst:24:1:vale.Annotations:'TODO' left in text

  - name: skip-inline
    about: "#1052"
    args: .
    exit: 0
    want: ""

  - name: skip-inline-mask
    about: "#1173 -- an inline element in SkippedScopes is masked, not
      dropped, so the words around it keep their distance"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion
        SkippedScopes = code

        [*.md]
        BasedOnStyles = T
      styles/T/Contractions.yml: |
        extends: substitution
        message: "Use '%s' instead of '%s'."
        level: error
        ignorecase: true
        swap:
          'where is(?!\.)': where's
      test.md: |
        Something where `some_param` is `false`.

        Something where `x` is set.

        Something where is it.
    args: test.md
    exit: 1
    want: |
      test.md:5:11:T.Contractions:Use 'where's' instead of 'where is'.

  - name: skip-pre-code
    about: "#1198 -- with both `pre` and `code` skipped, the `<code>` inside a
      fenced block's `<pre>` doesn't end the skip, and neither does text that
      reads `pre`"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion
        SkippedScopes = script, style, pre, code

        [*.md]
        BasedOnStyles = T
      styles/T/Semicolon.yml: |
        extends: existence
        message: "Semicolon found."
        level: warning
        nonword: true
        tokens:
          - ';'
      test.md: |
        # Title

        Prose with `inline; code` and a fenced block:

        ```json
        { "a": 1; "b": 2 }
        ```

        ```text
        pre
        a; b
        ```

        Prose after the block; with a semicolon.
    args: test.md
    exit: 0
    want: |
      test.md:14:22:T.Semicolon:Semicolon found.

  - name: inline-spacing
    about: "#1111, #1119. The adoc headings are #502: a token that markup
      extraction introduced fails the strict threshold, and the alert is placed
      on the heading."
    dir: inline-space
    args: .
    requires: asciidoctor
    exit: 1
    want: |
      test.adoc:3:6:rules.InlineTitle:'Mixing ****************s' should use title-style capitalization.
      test.adoc:5:6:rules.InlineTitle:'One Tree of ********s' should use title-style capitalization.
      test.adoc:7:6:rules.InlineTitle:'Using ***s Here' should use title-style capitalization.
      test.md:7:6:rules.InlineSpace:Use a non-breaking space before 'd\x{00A0}:'.

  - name: inline-boundary
    about: "Whitespace at an inline-markup boundary is the source's, never
      inferred: a line break stays a line break (#1174), a space stays a space
      (#1119), no space stays no space (#1111), a `<br>` separates its sides
      (#1157), and a bracket binds tightly (#1056). A word repeated across a
      boundary is still a repeat (#1157)."
    args: .
    exit: 1
    want: |
      test.html:8:36:rules.InlineBreak:'e ,' puts a space before a comma.
      test.html:12:15:rules.InlineSpace:Use a non-breaking space before 'd\x{00A0}:'.
      test.html:15:9:rules.InlineSplit:'auto' was split from the word it belongs to.
      test.html:17:1:rules.InlineGlued:'* s' sits beside inline code.
      test.html:23:17:rules.InlineFused:'e.R' fuses two sentences.
      test.html:25:4:rules.InlineRepeat:'Click' is repeated.
      test.html:26:4:rules.InlineRepeat:'Click' is repeated.
      test.html:28:4:rules.InlineRepeat:'Click' is repeated.
      test.html:31:11:rules.InlineParen:'( ' pads a parenthesis.
      test.html:31:17:rules.InlineParen:' )' pads a parenthesis.
      test.md:15:19:rules.InlineBreak:'e ,' puts a space before a comma.
      test.md:26:6:rules.InlineSpace:Use a non-breaking space before 'd\x{00A0}:'.
      test.md:34:6:rules.InlineSplit:'auto' was split from the word it belongs to.
      test.md:38:1:rules.InlineGlued:'* s' sits beside inline code.
      test.md:56:14:rules.InlineFused:'e.R' fuses two sentences.
      test.md:60:4:rules.InlineRepeat:'Click' is repeated.
      test.md:62:1:rules.InlineRepeat:'Click' is repeated.
      test.md:66:1:rules.InlineRepeat:'Click' is repeated.
      test.md:74:8:rules.InlineParen:'( ' pads a parenthesis.
      test.md:74:14:rules.InlineParen:' )' pads a parenthesis.

