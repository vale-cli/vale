# Scope selectors, and the text each one does and doesn't reach.
name: scopes
dir: fixtures/scopes/*
# `*` above: each case runs in a directory named after it.

cases:
  - name: negated
    dir: multi
    args: .
    exit: 1
    want: |
      test.md:1:29:rules.Negated:'THREE' left in text
      test.md:1:35:rules.HN:'FOUR' left in text
      test.md:5:29:rules.HN:'FOUR' left in text
      test.md:11:20:rules.Negated:'THREE' left in text
      test.md:11:26:rules.HN:'FOUR' left in text
      test.md:13:11:rules.Para:Don't use 'paragraph' in a blockquote.
      test.md:19:1:rules.And:Don't use 'TODO' in a blockquote OR heading.

  - name: paragraph
    about: "#1132 -- headings, table cells, list items, blockquotes, and
      frontmatter are not paragraphs"
    args: .
    exit: 1
    want: |
      test.md:6:16:T.Para:'ZQX' in a paragraph

  - name: chained
    about: "#1133 -- every term of an `&` chain switches on what it needs, so
      a chained scope fires without an unrelated rule declaring the term alone"
    args: .
    exit: 1
    want: |
      test.md:1:16:T.Chained:paragraph & ~heading
      test.md:1:25:T.ChainedSentence:sentence & ~blockquote
      test.md:3:31:T.ChainedSentence:sentence & ~blockquote

  - name: matrix
    about: one rule per scope over one document holding every element, so the
      full output says exactly which text each scope does and doesn't reach
    args: .
    exit: 1
    want: |
      test.md:3:69:M.Raw:raw
      test.md:6:21:M.Paragraph:paragraph
      test.md:6:26:M.Sentence:sentence
      test.md:6:76:M.Raw:raw
      test.md:6:122:M.Sentence:sentence
      test.md:6:131:M.Paragraph:paragraph
      test.md:8:27:M.Sentence:sentence
      test.md:8:32:M.Heading:heading
      test.md:8:77:M.Raw:raw
      test.md:10:15:M.Sentence:sentence
      test.md:10:25:M.TableHeader:table.header
      test.md:10:45:M.Raw:raw
      test.md:12:13:M.Sentence:sentence
      test.md:12:28:M.TableCell:table.cell
      test.md:12:43:M.Raw:raw
      test.md:14:24:M.Sentence:sentence
      test.md:14:44:M.List:list
      test.md:14:54:M.Raw:raw
      test.md:16:24:M.Sentence:sentence
      test.md:16:49:M.Blockquote:blockquote
      test.md:16:54:M.Raw:raw
      test.md:18:24:M.Link:link
      test.md:18:61:M.Strong:strong
      test.md:18:79:M.Emphasis:emphasis
      test.md:18:98:M.Code:code
      test.md:18:119:M.Paragraph:paragraph

  - name: raw
    args: .
    exit: 1
    want: |
      test.md:5:1:rules.Raw:Don't use italics/bolding in a heading.
      test.md:9:1:rules.Fence:Syntax highlighting hint "```sh " must be one of: yaml, ruby, plaintext, markdown, javascript, shell, golang, python, dockerfile, or typescript.
      test.py:1:1:rules.Raw:Don't use italics/bolding in a heading.

  - name: blockquote
    args: .
    requires: asciidoctor, rst2html
    exit: 1
    want: |
      test.adoc:5:12:rules.Quote:Don't use 'here' in a blockquote.
      test.md:3:20:rules.Quote:Don't use 'here' in a blockquote.
      test.rst:3:22:rules.Quote:Don't use 'here' in a blockquote.

  - name: class
    args: .
    requires: asciidoctor
    exit: 0
    want: |
      test.adoc:3:4:rules.Class:class scope matched 'widget'

  - name: inline-scopes
    about: "#1002"
    dir: inline
    args: .
    requires: asciidoctor
    exit: 0
    want: |
      test.adoc:1:27:rules.LinkText:link: 'here'
      test.adoc:3:10:rules.StrongText:strong: 'urgent'
      test.adoc:3:31:rules.EmphasisText:emphasis: 'subtle'
      test.adoc:3:52:rules.CodeText:code: 'deprecated'
      test.md:1:8:rules.LinkText:link: 'here'
      test.md:3:11:rules.StrongText:strong: 'urgent'
      test.md:3:33:rules.EmphasisText:emphasis: 'subtle'
      test.md:3:54:rules.CodeText:code: 'deprecated'
      test.md:7:6:rules.StrongText:strong: 'urgent'
      test.md:7:20:rules.LinkText:link: 'here'
      test.md:9:13:rules.LinkText:link: 'here'
      test.md:9:45:rules.LinkText:link: 'here'
      test.md:11:4:rules.LinkText:link: 'here'
      test.md:11:42:rules.LinkText:link: 'here'
      test.md:13:15:rules.StrongText:strong: 'urgent'
      test.md:13:31:rules.StrongText:strong: 'urgent'
      test.md:15:14:rules.CodeText:code: 'deprecated'
      test.md:15:32:rules.CodeText:code: 'deprecated'
      test.md:17:21:rules.LinkText:link: 'here'
      test.md:17:48:rules.StrongText:strong: 'urgent'
      test.md:19:19:rules.LinkText:link: 'here'
      test.md:23:17:rules.StrongText:strong: 'urgent'
      test.md:25:17:rules.EmphasisText:emphasis: 'subtle'
      test.md:28:13:rules.LinkText:link: 'here'

  - name: sentences
    dir: sentence
    args: .
    exit: 0
    want: |
      test.md:1:3:rules.Sentence:'Test'
      test.md:3:1:rules.Sentence:'The controller requires a current of 2 A max.'
      test.md:4:1:rules.Sentence:'The device’s current support for bluetooth is being deprecated.'

  - name: skip
    args: .
    requires: rst2html
    exit: 0
    want: |
      test.md:3:1:vale.Annotations:'TODO' left in text
      test.rst:20:1:vale.Annotations:'TODO' left in text
      test.rst:24:1:vale.Annotations:'TODO' left in text

  - name: skip-inline
    about: "#1052"
    args: .
    exit: 0
    want: ""

  - name: skip-inline-mask
    about: "#1173 -- an inline element in SkippedScopes is masked, not
      dropped, so the words around it keep their distance"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion
        SkippedScopes = code

        [*.md]
        BasedOnStyles = T
      styles/T/Contractions.yml: |
        extends: substitution
        message: "Use '%s' instead of '%s'."
        level: error
        ignorecase: true
        swap:
          'where is(?!\.)': where's
      test.md: |
        Something where `some_param` is `false`.

        Something where `x` is set.

        Something where is it.
    args: test.md
    exit: 1
    want: |
      test.md:5:11:T.Contractions:Use 'where's' instead of 'where is'.

  - name: inline-spacing
    about: "#1111, #1119. The adoc headings are #502: a token that markup
      extraction introduced fails the strict threshold, and the alert is placed
      on the heading rather than dropped for having nowhere to go."
    dir: inline-space
    args: .
    requires: asciidoctor
    exit: 1
    want: |
      test.adoc:3:6:rules.InlineTitle:'Mixing ****************s' should use title-style capitalization.
      test.adoc:5:6:rules.InlineTitle:'One Tree of ********s' should use title-style capitalization.
      test.md:7:6:rules.InlineSpace:Use a non-breaking space before 'd\x{00A0}:'.

  - name: inline-boundary
    about: "Whitespace at an inline-markup boundary is the source's, never
      inferred: a line break stays a line break (#1174), a space stays a space
      (#1119), no space stays no space (#1111), a `<br>` separates its sides
      (#1157), and a bracket binds tightly (#1056). A word repeated across a
      boundary is still a repeat (#1157)."
    args: .
    exit: 1
    want: |
      test.html:8:36:rules.InlineBreak:'e ,' puts a space before a comma.
      test.html:12:15:rules.InlineSpace:Use a non-breaking space before 'd\x{00A0}:'.
      test.html:15:9:rules.InlineSplit:'auto' was split from the word it belongs to.
      test.html:17:1:rules.InlineGlued:'* s' sits beside inline code.
      test.html:23:17:rules.InlineFused:'e.R' fuses two sentences.
      test.html:25:4:rules.InlineRepeat:'Click' is repeated.
      test.html:26:4:rules.InlineRepeat:'Click' is repeated.
      test.html:28:4:rules.InlineRepeat:'Click' is repeated.
      test.html:31:11:rules.InlineParen:'( ' pads a parenthesis.
      test.html:31:17:rules.InlineParen:' )' pads a parenthesis.
      test.md:15:19:rules.InlineBreak:'e ,' puts a space before a comma.
      test.md:26:6:rules.InlineSpace:Use a non-breaking space before 'd\x{00A0}:'.
      test.md:34:6:rules.InlineSplit:'auto' was split from the word it belongs to.
      test.md:38:1:rules.InlineGlued:'* s' sits beside inline code.
      test.md:56:14:rules.InlineFused:'e.R' fuses two sentences.
      test.md:60:4:rules.InlineRepeat:'Click' is repeated.
      test.md:62:1:rules.InlineRepeat:'Click' is repeated.
      test.md:66:1:rules.InlineRepeat:'Click' is repeated.
      test.md:74:8:rules.InlineParen:'( ' pads a parenthesis.
      test.md:74:14:rules.InlineParen:' )' pads a parenthesis.

  - name: attr
    args: .
    requires: asciidoctor, rst2html
    exit: 0
    want: |
      test.adoc:3:16:rules.Alt:alt text should be less than 125 characters.
      test.md:3:3:rules.Alt:alt text should be less than 125 characters.
      test.rst:4:10:rules.Alt:alt text should be less than 125 characters.

  - name: inline
    dir: link
    args: .
    requires: asciidoctor, rst2html
    exit: 1
    want: |
      test.adoc:1:34:rules.Link:Don't use '[here]' as the content of a link.
      test.adoc:5:56:rules.Link:Don't use '[here]' as the content of a link.
      test.md:3:19:rules.Code:'`XXX`' left in text
      test.md:5:34:rules.Link:Don't use '[here]' as the content of a link.
      test.md:7:56:rules.Link:Don't use '[here]' as the content of a link.
      test.md:9:10:rules.Strong:'TODO' left in text
      test.md:11:3:rules.Strong:'TODO' left in text
      test.md:13:6:rules.Code:'`XXX`' left in text
      test.md:15:1:rules.Code:'`XXX`' left in text

  - name: heading
    args: .
    requires: asciidoctor, dita, rst2html, xsltproc
    exit: 1
    want: |
      test.adoc:1:20:rules.Heading:'XXX' left in text
      test.adoc:1:28:rules.H3:'THREE' left in text
      test.adoc:3:26:rules.Heading:'TODO' left in text
      test.adoc:3:31:rules.H2:'TWO' left in text
      test.adoc:7:27:rules.Heading:'TODO' left in text
      test.adoc:7:36:rules.H3:'THREE' left in text
      test.adoc:9:28:rules.Heading:'TODO' left in text
      test.dita:6:36:rules.Heading:'TODO' left in text
      test.dita:23:36:rules.Heading:'NOTE' left in text
      test.html:39:96:rules.Heading:'TODO' left in text
      test.html:59:99:rules.Heading:'XXX' left in text
      test.md:1:21:rules.Heading:'XXX' left in text
      test.md:1:35:rules.HN:'FOUR' left in text
      test.md:3:5:rules.Heading:'TODO' left in text
      test.md:3:19:rules.H2:'TWO' left in text
      test.md:3:29:rules.HN:'FOUR' left in text
      test.md:9:6:rules.Heading:'TODO' left in text
      test.md:9:20:rules.H3:'THREE' left in text
      test.md:9:26:rules.HN:'FOUR' left in text
      test.md:11:6:rules.MinH2:Headings should have at least 100 characters.
      test.rst:2:9:rules.Heading:'XXX' left in text
      test.rst:5:19:rules.Heading:'TODO' left in text
      test.xml:13:23:rules.Heading:'TODO' left in text
      test.xml:23:21:rules.Heading:'XXX' left in text

  - name: asciidoc-sectnums
    about: "#1101"
    dir: headings-attrs
    args: .
    requires: asciidoctor
    exit: 1
    want: |
      test.adoc:1:3:Test.Headings:'document title' should use title-style capitalization.
      test.adoc:5:4:Test.Headings:'about the document' should use title-style capitalization.

  - name: asciidoc-anchors
    about: "#1109"
    dir: adoc-heading-xref
    args: .
    requires: asciidoctor
    exit: 1
    want: |
      test.adoc:4:4:Test.Headings:'first heading lowercase' should use title-style capitalization.
      test.adoc:9:4:Test.Headings:'second heading lowercase' should use title-style capitalization.
      test.adoc:13:4:Test.Headings:'third heading lowercase' should use title-style capitalization.

  - name: table
    args: .
    requires: asciidoctor, rst2html
    exit: 1
    want: |
      test.adoc:9:2:rules.Table:'TODO' left in text
      test.adoc:15:20:rules.Table:'XXX' left in text
      test.html:24:69:rules.Table:'TODO' left in text
      test.md:12:10:rules.Table:'TODO' left in text
      test.md:20:12:rules.Table:'TODO' left in text
      test.rst:15:16:rules.Table:'TODO' left in text
      test.rst:17:3:rules.Table:'XXX' left in text

  - name: list
    args: .
    requires: asciidoctor, rst2html
    exit: 1
    want: |
      test.adoc:7:11:rules.List:'TODO' left in text
      test.adoc:9:11:rules.List:'TODO' left in text
      test.html:14:12:rules.List:'TODO' left in text
      test.html:20:12:rules.List:'TODO' left in text
      test.md:7:3:rules.List:'TODO' left in text
      test.md:8:3:rules.List:'TODO' left in text
      test.md:12:4:rules.List:'XXX' left in text
      test.rst:9:3:rules.List:'TODO' left in text
      test.rst:10:3:rules.List:'TODO' left in text
      test.rst:14:4:rules.List:'XXX' left in text

  - name: ignored-comment-scope
    about: "#858 -- `IgnoredScopes` excludes a comment scope when the file is
      read as source."
    files:
      .vale.ini: |
        MinAlertLevel = suggestion
        IgnoredScopes = text.comment.block

        [*.py]
        BasedOnStyles = Vale
        Vale.Terms = NO
      example.py: |
        # The folowing function computes an area.

        def area(radius: float) -> float:
            """Compute the area of a circle.

            Takes the raduis and returns the area.
            """
            return 3.14 * radius ** 2
    args: example.py
    exit: 1
    want: |
      example.py:1:7:Vale.Spelling:Did you really mean 'folowing'?
    absent:
      - raduis

  - name: ignored-comment-scope-mapped
    about: "#858 -- and when a markup format is mapped onto it. Mapping one
      switches which reader runs; it must not cost the ability to leave a
      docstring alone, which `BlockIgnores` cannot do in its place -- by the
      time those patterns run, the delimiters they match are gone."
    files:
      .vale.ini: |
        MinAlertLevel = suggestion
        IgnoredScopes = text.comment.block

        [formats]
        py = md

        [*.py]
        BasedOnStyles = Vale
        Vale.Terms = NO
      example.py: |
        # The folowing function computes an area.

        def area(radius: float) -> float:
            """Compute the area of a circle.

            Takes the raduis and returns the area.
            """
            return 3.14 * radius ** 2
    args: example.py
    exit: 1
    want: |
      example.py:1:7:Vale.Spelling:Did you really mean 'folowing'?
    absent:
      - raduis
