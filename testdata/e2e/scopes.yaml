    want: |
      test.md:3:1:L.Lead:The paragraph after the title runs over 4 words.
      test.md:5:4:L.Heading:'TODO' in an h2.

  - name: quote
    about: "`quote` is the text between quotation marks, an inline scope like
      `link`: a rule scoped to it reads speech, one scoped to `~quote` reads
      narration with the speech left out, and a `doc(...)` selector may name
      `q`. Markdown and plain text have no markup for a quotation, so the
      marks are paired -- curly, straight, or single, with an apostrophe left
      inside -- and an unclosed one runs to the end of its paragraph. HTML's
      own `q` counts as one."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        BasedOnStyles = Q
      styles/Q/Speech.yml: |
        extends: existence
        message: "'%s' in speech."
        level: error
        scope: quote
        tokens:
          - knew
      styles/Q/Narration.yml: |
        extends: existence
        message: "'%s' in narration."
        level: warning
        scope: ~quote
        tokens:
          - knew
      styles/Q/Long.yml: |
        extends: occurrence
        message: "%d words of speech."
        level: suggestion
        scope: quote
        token: '\b\w+\b'
        max: 3
      test.md: |
        # Title

        "I knew it," she said. He knew nothing. *She* said, "we knew that much."

        "An unclosed line, and she knew it

        She knew that. ‘Don’t,’ he said, ‘I knew.’
      test.txt: |
        "I knew it," she said. He knew nothing. *She* said, "we knew that much."

        "An unclosed line, and she knew it

        She knew that. ‘Don’t,’ he said, ‘I knew.’
      test.html: |
        <p>He <q>knew</q> that "she knew" too.</p>
    args: --output=line --no-exit test.md test.txt test.html
    exit: 0
    want: |
      test.html:1:10:Q.Speech:'knew' in speech.
      test.html:1:29:Q.Speech:'knew' in speech.
      test.md:3:4:Q.Speech:'knew' in speech.
      test.md:3:27:Q.Narration:'knew' in narration.
      test.md:3:54:Q.Long:4 words of speech.
      test.md:3:57:Q.Speech:'knew' in speech.
      test.md:5:2:Q.Long:7 words of speech.
      test.md:5:28:Q.Speech:'knew' in speech.
      test.md:7:5:Q.Narration:'knew' in narration.
      test.md:7:37:Q.Speech:'knew' in speech.
      test.txt:1:4:Q.Speech:'knew' in speech.
      test.txt:1:27:Q.Narration:'knew' in narration.
      test.txt:1:54:Q.Long:4 words of speech.
      test.txt:1:57:Q.Speech:'knew' in speech.
      test.txt:3:2:Q.Long:7 words of speech.
      test.txt:3:28:Q.Speech:'knew' in speech.
      test.txt:5:5:Q.Narration:'knew' in narration.
      test.txt:5:37:Q.Speech:'knew' in speech.

  - name: named
    about: "a named scope, defined once under config/scopes, stands in for
      its expression wherever a rule would write it: alone, negated, or in
      a chain. A name for a chain joins the rule's own terms. Every file
      under the directory is read, so a package's names arrive with its
      rules and nothing in the configuration has to mention them."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = N
      styles/config/scopes/Sections.yml: |
        methods: 'doc(section:has(> h2:contains("Methods")))'
        lead: text & doc(h1 + p)
      styles/N/Blinding.yml: |
        extends: occurrence
        message: "Methods says nothing about blinding."
        level: error
        scope: methods
        token: '(?i)\bblind'
        min: 1
      styles/N/Hedge.yml: |
        extends: existence
        message: "'%s' outside Methods."
        level: warning
        scope: ~methods
        tokens:
          - maybe
      styles/N/Lead.yml: |
        extends: occurrence
        message: "The lead runs over 4 words."
        level: error
        scope: lead
        token: '\b\w+\b'
        max: 4
      test.md: |
        # Title

        A lead paragraph that maybe runs long.

        ## Methods

        We did things, maybe.

        ## Results

        Nothing, maybe.
    args: test.md
    exit: 1
    want: |
      test.md:3:1:N.Lead:The lead runs over 4 words.
      test.md:3:23:N.Hedge:'maybe' outside Methods.
      test.md:5:4:N.Blinding:Methods says nothing about blinding.
      test.md:11:10:N.Hedge:'maybe' outside Methods.

  - name: named-reserved
    about: a name Vale already gives a scope is refused when it is read
    files:
      .vale.ini: |
        StylesPath = styles

        [*.md]
        BasedOnStyles = N
      styles/config/scopes/Bad.yml: |
        heading: doc(h1)
      styles/N/Rule.yml: |
        extends: existence
        message: "'%s'"
        tokens:
          - maybe
      test.md: |
        Maybe.
    args: test.md
    exit: 2
    contains: "'heading' is a scope Vale defines"

  - name: selectors
    about: "the selector syntax is Selectors Level 4: a group of relative
      selectors in `:has()`, with `>`, `+`, and `~`, and `:is()` or
      `:where()` for one of several. A section that opens with either
      heading level is one selection, and a paragraph is found from the
      heading beside it."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = L
      styles/L/Methods.yml: |
        extends: occurrence
        message: "Methods says nothing about blinding."
        level: error
        scope: 'doc(section:has(> h1:contains("methods"), > h2:contains("methods")))'
        token: '(?i)\bblind'
        min: 1
      styles/L/Either.yml: |
        extends: existence
        message: "'%s' in a section heading."
        level: warning
        scope: 'doc(section > :is(h2, h3))'
        tokens:
          - Draft
      styles/L/Empty.yml: |
        extends: existence
        message: "'%s' right after a heading."
        level: warning
        scope: 'doc(section:has(> h2 + p:contains("nothing")))'
        tokens:
          - Nothing
      test.md: |
        # Title

        ## Methods

        We did things.

        ### Draft notes

        Nothing.

        ## Draft results

        Nothing.
    args: test.md
    exit: 1
    want: |
      test.md:3:4:L.Methods:Methods says nothing about blinding.
      test.md:7:5:L.Either:'Draft' in a section heading.
      test.md:11:4:L.Either:'Draft' in a section heading.
      test.md:13:1:L.Empty:'Nothing' right after a heading.
