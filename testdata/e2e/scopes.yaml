      test.md:8:3:rules.List:'TODO' left in text
      test.md:12:4:rules.List:'XXX' left in text
      test.rst:9:3:rules.List:'TODO' left in text
      test.rst:10:3:rules.List:'TODO' left in text
      test.rst:14:4:rules.List:'XXX' left in text

  - name: ignored-comment-scope
    about: "#858 -- `IgnoredScopes` excludes a comment scope when the file is
      read as source."
    files:
      .vale.ini: |
        MinAlertLevel = suggestion
        IgnoredScopes = text.comment.block

        [*.py]
        BasedOnStyles = Vale
        Vale.Terms = NO
      example.py: |
        # The folowing function computes an area.

        def area(radius: float) -> float:
            """Compute the area of a circle.

            Takes the raduis and returns the area.
            """
            return 3.14 * radius ** 2
    args: example.py
    exit: 1
    want: |
      example.py:1:7:Vale.Spelling:Did you really mean 'folowing'?
    absent:
      - raduis

  - name: ignored-comment-scope-mapped
    about: "#858 -- and when a markup format is mapped onto it. Mapping one
      switches which reader runs; it must not cost the ability to leave a
      docstring alone, which `BlockIgnores` cannot do in its place -- by the
      time those patterns run, the delimiters they match are gone."
    files:
      .vale.ini: |
        MinAlertLevel = suggestion
        IgnoredScopes = text.comment.block

        [formats]
        py = md

        [*.py]
        BasedOnStyles = Vale
        Vale.Terms = NO
      example.py: |
        # The folowing function computes an area.

        def area(radius: float) -> float:
            """Compute the area of a circle.

            Takes the raduis and returns the area.
            """
            return 3.14 * radius ** 2
    args: example.py
    exit: 1
    want: |
      example.py:1:7:Vale.Spelling:Did you really mean 'folowing'?
    absent:
      - raduis

  - name: negated-inline
    about: "A rule whose scope negates an inline element, `~link`, runs on
      the block but never sees that element's text, so a casing rule can
      leave headings and link text, which follow title case, alone."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/Caps.yml: |
        extends: substitution
        message: "Use '%s' for '%s'."
        level: error
        ignorecase: true
        scope: ~heading & ~link
        swap:
          foo bar: Foo Bar
      test.md: |
        # Heading With foo bar

        Plain foo bar here and [link foo bar](https://x.y) and more foo bar.

        - Item foo bar and [foo bar](https://x.y) and *bold foo bar*.
    args: --output=line --no-exit test.md
    exit: 0
    want: |
      test.md:3:7:T.Caps:Use 'Foo Bar' for 'foo bar'.
      test.md:3:61:T.Caps:Use 'Foo Bar' for 'foo bar'.
      test.md:5:8:T.Caps:Use 'Foo Bar' for 'foo bar'.
      test.md:5:53:T.Caps:Use 'Foo Bar' for 'foo bar'.

  - name: doc-group
    about: "A `doc(...)` selector may be a comma-separated group at the top
      level, as it may inside `:has(...)`: `doc(blockquote, ul)` names either
      element as the block, and `text & doc(h2, h3)` looks inside either."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = G
      styles/G/Todo.yml: |
        extends: existence
        message: "'%s' in an h2 or h3."
        level: error
        scope: text & doc(h2, h3)
        tokens:
          - TODO
      styles/G/Draft.yml: |
        extends: existence
        message: "'%s' in a blockquote or list."
        level: error
        scope: doc(blockquote, ul)
        tokens:
          - draft
      test.md: |
        # TODO top

        ## TODO second

        A draft paragraph.

        > A draft quote.

        - A draft item.

        ### TODO third

        #### TODO fourth
    args: --output=line --no-exit test.md
    exit: 0
    want: |
      test.md:3:4:G.Todo:'TODO' in an h2 or h3.
      test.md:7:5:G.Draft:'draft' in a blockquote or list.
      test.md:9:5:G.Draft:'draft' in a blockquote or list.
      test.md:11:5:G.Todo:'TODO' in an h2 or h3.

  - name: doc-leaf
    about: "A selection on an element with no children of its own -- a
      paragraph, a heading -- is that element's text as one block. It was
      empty: the aggregate was dropped when the end tag was read, before the
      flush that gathers the element's own text, so only a container with
      children inside it ever had anything to lint."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = L
      styles/L/Heading.yml: |
        extends: existence
        message: "'%s' in an h2."
        level: error
        scope: doc(h2)
        tokens:
          - TODO
      styles/L/Lead.yml: |
        extends: occurrence
        message: "The paragraph after the title runs over 4 words."
        level: error
        scope: doc(h1 + p)
        max: 4
        token: \b\w+\b
      test.md: |
        # TODO top

        A lead paragraph that runs long.

        ## TODO second

        A body paragraph.
