# Scope selectors, and the text each one does and doesn't reach.
name: scopes
dir: fixtures/scopes/*
# `*` above: each case runs in a directory named after it.

cases:
  - name: negated
    dir: multi
    args: .
    exit: 1
    want: |
      test.md:1:29:rules.Negated:'THREE' left in text
      test.md:1:35:rules.HN:'FOUR' left in text
      test.md:5:29:rules.HN:'FOUR' left in text
      test.md:11:20:rules.Negated:'THREE' left in text
      test.md:11:26:rules.HN:'FOUR' left in text
      test.md:13:11:rules.Para:Don't use 'paragraph' in a blockquote.
      test.md:19:1:rules.And:Don't use 'TODO' in a blockquote OR heading.

  - name: doc
    about: "`doc(...)` selects elements of the document view by CSS selector.
      Alone, the element is the block, measured or counted as one; beside a
      scope, it narrows that scope to blocks inside the element; negated, it
      excludes them. Sections nest, so an h3 under Context is in Context. An
      ordinary rule fires once per occurrence, so the selection block adds no
      second pass over its text. `sequence` reads the sentences inside the
      selection. A selection the document never opens is an empty block on
      line one, so a count can report the section as missing."
    args: test.md
    exit: 1
    want: |
      test.md:1:1:D.Required:An ADR has a Rationale section.
      test.md:3:6:D.Outside:'worth noting' hedges outside Context.
      test.md:7:11:D.Lead:'Alternatively' in the paragraph after an h2.
      test.md:7:11:D.Plain:'Alternatively' anywhere, once per occurrence.
      test.md:9:4:D.Decision:The Context section states no decision, and it should not.
      test.md:11:4:D.Seq:'could' is a modal and a verb, and inside Context.
      test.md:11:30:D.Hedge:'worth noting' hedges inside Context.
      test.md:13:1:D.Plain:'Alternatively' anywhere, once per occurrence.
      test.md:17:3:D.Nested:'nested' is inside Context, by way of its h3.
      test.md:21:30:D.Lead:'Alternatively' in the paragraph after an h2.
      test.md:21:30:D.Plain:'Alternatively' anywhere, once per occurrence.
      test.md:23:1:D.Words:Consequences runs 10.00 words. The budget is 5.
      test.md:26:8:D.Outside:'worth noting' hedges outside Context.

  - name: paragraph
    about: "#1132 -- headings, table cells, list items, blockquotes, and
      frontmatter are not paragraphs"
    args: .
    exit: 1
    want: |
      test.md:6:16:T.Para:'ZQX' in a paragraph

  - name: chained
    about: "#1133 -- every term of an `&` chain switches on what it needs, so
      a chained scope fires without an unrelated rule declaring the term alone"
    args: .
    exit: 1
    want: |
      test.md:1:16:T.Chained:paragraph & ~heading
      test.md:1:25:T.ChainedSentence:sentence & ~blockquote
      test.md:3:31:T.ChainedSentence:sentence & ~blockquote

  - name: matrix
    about: one rule per scope over one document holding every element, so the
      full output says exactly which text each scope does and doesn't reach
    args: .
    exit: 1
    want: |
      test.md:3:69:M.Raw:raw
      test.md:6:21:M.Paragraph:paragraph
      test.md:6:26:M.Sentence:sentence
      test.md:6:76:M.Raw:raw
      test.md:6:122:M.Sentence:sentence
      test.md:6:131:M.Paragraph:paragraph
      test.md:8:27:M.Sentence:sentence
      test.md:8:32:M.Heading:heading
      test.md:8:77:M.Raw:raw
      test.md:10:15:M.Sentence:sentence
      test.md:10:25:M.TableHeader:table.header
      test.md:10:45:M.Raw:raw
      test.md:12:13:M.Sentence:sentence
      test.md:12:28:M.TableCell:table.cell
      test.md:12:43:M.Raw:raw
      test.md:14:24:M.Sentence:sentence
      test.md:14:44:M.List:list
      test.md:14:54:M.Raw:raw
      test.md:16:24:M.Sentence:sentence
      test.md:16:49:M.Blockquote:blockquote
      test.md:16:54:M.Raw:raw
      test.md:18:24:M.Link:link
      test.md:18:61:M.Strong:strong
      test.md:18:79:M.Emphasis:emphasis
      test.md:18:98:M.Code:code
      test.md:18:119:M.Paragraph:paragraph

  - name: raw
    args: .
    exit: 1
    want: |
      test.md:5:1:rules.Raw:Don't use italics/bolding in a heading.
      test.md:9:1:rules.Fence:Syntax highlighting hint "```sh " must be one of: yaml, ruby, plaintext, markdown, javascript, shell, golang, python, dockerfile, or typescript.
      test.py:1:1:rules.Raw:Don't use italics/bolding in a heading.

  - name: blockquote
    args: .
    requires: asciidoctor, rst2html
    exit: 1
    want: |
      test.adoc:5:12:rules.Quote:Don't use 'here' in a blockquote.
      test.md:3:20:rules.Quote:Don't use 'here' in a blockquote.
      test.rst:3:22:rules.Quote:Don't use 'here' in a blockquote.

  - name: class
    args: .
