  - name: issue-1007
    about: "#1007 -- a term repeated later in the frontmatter or a blockquote
      doesn't pull the alert off its first occurrence, and every occurrence
      is reported"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion
        Vocab = test-vocab

        [*.md]
        BasedOnStyles = Vale
      styles/config/vocabularies/test-vocab/accept.txt: |
        CASTLE
      front.md: |
        ---
        title: castle
        tags: ['castle', 'gitlab', 'sonarqube']
        weight: 8
        ---

        ## Intro

        Hello, I love a CASTLE.
      quote.md: |
        > Hello, I love a castle.
        > It's castle!
    args: front.md quote.md
    exit: 1
    want: |
      front.md:2:8:Vale.Terms:Use 'CASTLE' instead of 'castle'.
      quote.md:1:19:Vale.Terms:Use 'CASTLE' instead of 'castle'.
      quote.md:2:8:Vale.Terms:Use 'CASTLE' instead of 'castle'.

  - name: issue-687
    about: "#687 -- spans cover the file's actual bytes: `&rsquo;` is
      normalized for matching, but the reported span accounts for its width,
      whether the entity sits inside the match or before it"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.html]
        T.Contraction = YES
        T.Real = YES
      styles/T/Contraction.yml: |
        extends: existence
        message: "Avoid '%s'."
        level: error
        raw:
          - "it['’]s"
      styles/T/Real.yml: |
        extends: existence
        message: "Avoid '%s'."
        level: error
        tokens:
          - real
      test.html: |
        <p>You know it&rsquo;s great software</p>
        <p>It&rsquo;s a real word test</p>
    args: --output=JSON test.html
    exit: 1
    want: |
      {
        "test.html": [
          {
            "Action": {
              "Name": "",
              "Params": null
            },
            "Span": [
              13,
              22
            ],
            "Check": "T.Contraction",
            "Description": "",
            "Link": "",
            "Message": "Avoid 'it's'.",
            "Severity": "error",
            "Match": "it's",
            "Line": 1
          },
          {
            "Action": {
              "Name": "",
              "Params": null
            },
            "Span": [
              17,
              20
            ],
            "Check": "T.Real",
            "Description": "",
            "Link": "",
            "Message": "Avoid 'real'.",
            "Severity": "error",
            "Match": "real",
            "Line": 2
          }
        ]
      }

  - name: issue-791
    about: "#791 -- a tight list item with a nested list is its own `list`
      block: an end-anchored rule sees the item's ending, not the nested
      child's, and every unpunctuated item is reported at its final word"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        T.ListPunct = YES
      styles/T/ListPunct.yml: |
        extends: existence
        message: "Must put the ending punctuation at the end of a list item."
        nonword: true
        level: error
        scope: list
        tokens:
          - '[^.!?]\s*$'
      test.md: |
        # Testing

        ## Unordered Lists with Different Bullets

        - Item with punctuation.
        + Item without punctuation
        * Another item with punctuation.

        ## Ordered Lists

        1. First ordered item with punctuation.
        2. Second ordered item without punctuation
            - Nested unordered with punctuation.
            + Nested unordered without punctuation
    args: test.md
    exit: 1
    want: |
      test.md:6:26:T.ListPunct:Must put the ending punctuation at the end of a list item.
      test.md:12:42:T.ListPunct:Must put the ending punctuation at the end of a list item.
      test.md:14:42:T.ListPunct:Must put the ending punctuation at the end of a list item.

