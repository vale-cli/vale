  - name: shadowed-by-code-span
    about: a match whose text also appears inside an earlier code span must be
      reported at its prose occurrence, not the span's
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s' in text"
        level: error
        nonword: true
        raw:
          - ZQX
      test.md: |
        A first paragraph.

        Inline `sum(x) # ZQX` and text ZQX after.

        Both ZQX one and ZQX two.
    args: test.md
    exit: 1
    want: |
      test.md:3:32:T.Tok:'ZQX' in text
      test.md:5:6:T.Tok:'ZQX' in text
      test.md:5:18:T.Tok:'ZQX' in text

  - name: styled-span-line
    about: a block located by a common final word (`it.`) landed on another
      line that happened to hold the same token, and the alert vanished into
      the dedup -- the block's longest word places it instead
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        T.Tok = YES
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s' left in text"
        level: error
        nonword: true
        raw:
          - ZQX
      test.md: |
        A first paragraph in it.

        See **bold prose with a ZQX in it** and *emphasis with a ZQX in it*.

        - A list item with a ZQX in it.
    args: test.md
    exit: 1
    want: |
      test.md:3:25:T.Tok:'ZQX' left in text
      test.md:3:58:T.Tok:'ZQX' left in text
      test.md:5:22:T.Tok:'ZQX' left in text

  - name: json-counts
    about: "--counts adds a per-check tally to JSON output, zeros included: an
      enabled check that never fires is otherwise invisible, so a dead rule is
      indistinguishable from a working one"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/Live.yml: |
        extends: existence
        message: "'%s' left in text"
        level: error
        tokens:
          - TODO
      styles/T/Dead.yml: |
        extends: existence
        message: "should never fire"
        level: error
        tokens:
          - zzzz-nothing
      doc.md: |
        A TODO left here.
    args: --output=JSON --counts doc.md
    exit: 1
    want: |
      {
        "files": {
          "doc.md": [
            {
              "Action": {
                "Name": "",
                "Params": null
              },
              "Span": [
                3,
                6
              ],
              "Check": "T.Live",
              "Description": "",
              "Link": "",
              "Message": "'TODO' left in text",
              "Severity": "error",
              "Match": "TODO",
              "Line": 1
            }
          ]
        },
        "counts": {
          "T.Dead": 0,
          "T.Live": 1
        }
      }
