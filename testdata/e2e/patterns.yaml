    args: test.mdx
    exit: 0
    want: |
      test.mdx:1:19:vale.Redundancy:'ACT test' is redundant
      test.mdx:7:19:vale.Redundancy:'ACT test' is redundant
      test.mdx:17:1:vale.Redundancy:'ACT test' is redundant

