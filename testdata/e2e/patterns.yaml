  - name: token-ignores-path-scoped
    about: "#839 -- a section keyed on a path, not an extension, still applies
      its ignore patterns"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T

        [tutorials/*.md]
        TokenIgnores = (\[\[[^\]]+\]\])
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s' found"
        level: error
        nonword: true
        raw:
          - (?:ZQX|QQV)
      tutorials/a.md: |
        Ignored [[ZQX]] here, but QQV is not.
      guides/b.md: |
        Not ignored [[ZQX]] here.
    args: .
    exit: 1
    want: |
      guides/b.md:1:15:T.Tok:'ZQX' found
      tutorials/a.md:1:27:T.Tok:'QQV' found

  - name: ignores-keep-escaped-commas
    about: "#1164 -- a comma escaped as `\\,` stays inside its pattern, so a
      quantifier like `{2,}` survives; a bare comma still separates patterns"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        BlockIgnores = BEGIN.{2\,}END

        [*.md]
        BasedOnStyles = T
        TokenIgnores = \b[a-z]{2\,}QQV\b, (<http[^\n]+>+?)
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s' found"
        level: error
        nonword: true
        raw:
          - (?:ZQX|QQV)
      a.md: |
        Ignored abQQV and <http://ZQX.example>, but QQV is not.

        BEGIN and ZQX inside END, but ZQX outside.
    args: a.md
    exit: 1
    want: |
      a.md:1:45:T.Tok:'QQV' found
      a.md:3:31:T.Tok:'ZQX' found

  - name: repeated-autolink
    about: "#847 -- an autolink's URL is one run of source, reported twice by
      the parser; masking the `href` copy used to send the text's search to the
      next identical URL in the document, moving every later block's alerts
      onto its line. The three files differ only in lines that hold no alert,
      so all three report the same two."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = T
      styles/T/GitHub.yml: |
        extends: substitution
        message: Use '%s' instead of '%s'
        level: warning
        ignorecase: true
        swap:
          GitHub: GitHub
      trailing-prose.md: |
        http://github.com bar

        [github](#whatever)
        [github1](#whatever)
        [github.](#whatever)

        https://jwodder.github.io/
        http://github.com

        whatever
      trailing-url.md: |
        http://github.com bar

        [github](#whatever)
        [github1](#whatever)
        [github.](#whatever)

        https://jwodder.github.io/

        http://github.com
      no-leading-url.md: |
        bar

        [github](#whatever)
        [github1](#whatever)
        [github.](#whatever)

        https://jwodder.github.io/

        http://github.com
    args: .
    exit: 0
    want: |
      no-leading-url.md:3:2:T.GitHub:Use 'GitHub' instead of 'github'
      no-leading-url.md:5:2:T.GitHub:Use 'GitHub' instead of 'github'
      trailing-prose.md:3:2:T.GitHub:Use 'GitHub' instead of 'github'
      trailing-prose.md:5:2:T.GitHub:Use 'GitHub' instead of 'github'
      trailing-url.md:3:2:T.GitHub:Use 'GitHub' instead of 'github'
      trailing-url.md:5:2:T.GitHub:Use 'GitHub' instead of 'github'

  - name: inline-markup-position
    about: "#502 -- a word split from its neighbour by an inline tag leaves the
      block's text nowhere in the source. Each alert is still placed by the
      runs the block was read from, rather than dropped or given the width of
      the line."
    files:
      .vale.ini: |
        MinAlertLevel = suggestion

        [*.html]
        BasedOnStyles = Vale
        Vale.Spelling = NO
        Vale.Terms = NO
        Vale.Avoid = NO
      sample.html: |
        <html>
        <body>
          <p>This paragraph has has a duplication.</p>
          <p>This paragraph has <b>has</b> a duplication.</p>
          <p>
            This paragraph has has a
            duplication on multiple lines.
          </p>

          <p>This paragraph has <b>has</b> an <font>obsolete</font> tag</p>
          <p>
            This paragraph has <b>has</b> a
            duplication on multiple lines.
          </p>
          <p>
            This paragraph has
            has a duplication
            across lines.
          </p>
        </body>
        </html>
    args: sample.html
    exit: 1
    want: |
      sample.html:3:21:Vale.Repetition:'has' is repeated!
      sample.html:4:21:Vale.Repetition:'has' is repeated!
      sample.html:6:20:Vale.Repetition:'has' is repeated!
      sample.html:10:21:Vale.Repetition:'has' is repeated!
      sample.html:12:20:Vale.Repetition:'has' is repeated!
      sample.html:16:20:Vale.Repetition:'has' is repeated!
