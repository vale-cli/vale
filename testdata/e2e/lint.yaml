# Every markup and source format Vale can lint.
name: lint
dir: fixtures/formats

cases:
  - name: excluded-folders
    dir: ../folders
    args: .
    exit: 0
    want: ""

  - name: css
    args: test.css
    exit: 0
    want: |
      test.css:1:4:vale.Annotations:'TODO' left in text
      test.css:7:19:vale.Annotations:'XXX' left in text

  - name: yaml
    args: test.yml
    exit: 0
    want: |
      test.yml:3:19:vale.Annotations:'TODO' left in text
      test.yml:15:45:vale.Annotations:'XXX' left in text

  - name: julia
    args: test.jl
    exit: 0
    want: |
      test.jl:1:3:vale.Annotations:'NOTE' left in text
      test.jl:4:3:vale.Annotations:'NOTE' left in text
      test.jl:9:7:vale.Annotations:'NOTE' left in text
      test.jl:21:17:vale.Annotations:'NOTE' left in text
      test.jl:47:3:vale.Annotations:'XXX' left in text

  - name: java
    args: test.java
    exit: 0
    want: |
      test.java:1:4:vale.Annotations:'XXX' left in text
      test.java:9:4:vale.Annotations:'TODO' left in text

  - name: proto
    args: test.proto
    exit: 0
    want: |
      test.proto:13:6:vale.Annotations:'NOTE' left in text
      test.proto:22:4:vale.Annotations:'XXX' left in text
      test.proto:31:1:vale.Annotations:'NOTE' left in text

  - name: org
    args: test.org
    exit: 0
    want: |
      test.org:17:4:vale.Annotations:'TODO' left in text
      test.org:50:18:vale.Annotations:'TODO' left in text

  - name: org-cross-file
    about: |
      #1129: a shared HTML writer carried each Org file's markup into the next,
      so a heading in one file was reported against a later one too.
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.org]
        BasedOnStyles = Test
      styles/Test/Heading.yml: |
        extends: existence
        message: "Found '%s'."
        level: warning
        scope: heading
        tokens:
          - Hello World
      a.org: |
        #+title: A

        * Hello World
      b.org: |
        #+title: B

        HelloWorld
    args: a.org b.org
    exit: 0
    want: |
      a.org:3:3:Test.Heading:Found 'Hello World'.

  - name: dita
    args: test.dita
    requires: dita
    exit: 0
    want: |
      test.dita:20:82:vale.Annotations:'TODO' left in text
      test.dita:25:21:vale.Annotations:'NOTE' left in text

  - name: xml
    args: test.xml
    requires: xsltproc
    exit: 0
    want: |
      test.xml:19:34:vale.Annotations:'TODO' left in text
      test.xml:23:21:vale.Annotations:'XXX' left in text
      test.xml:24:53:vale.Annotations:'FIXME' left in text

  - name: json
    args: test.json
    exit: 0
    want: |
      test.json:9:10:vale.Annotations:'XXX' left in text
      test.json:12:19:vale.Annotations:'TODO' left in text

  - name: text
    args: test.txt
    exit: 0
    want: |
      test.txt:1:27:vale.Annotations:'NOTE' left in text
      test.txt:4:12:vale.Annotations:'XXX' left in text
      test.txt:4:66:vale.Annotations:'TODO' left in text

  - name: asciidoc
    args: test.adoc
    requires: asciidoctor
    exit: 0
    want: |
      test.adoc:10:39:vale.Annotations:'TODO' left in text
      test.adoc:29:27:vale.Annotations:'XXX' left in text
      test.adoc:44:1:vale.Annotations:'TODO' left in text
      test.adoc:59:1:vale.Annotations:'FIXME' left in text
      test.adoc:59:21:vale.Annotations:'TODO' left in text
      test.adoc:59:27:vale.Annotations:'XXX' left in text
      test.adoc:64:38:vale.Annotations:'XXX' left in text
      test.adoc:66:20:vale.Annotations:'TODO' left in text
      test.adoc:75:16:vale.Annotations:'TODO' left in text
      test.adoc:79:6:vale.Annotations:'NOTE' left in text
      test.adoc:86:6:vale.Annotations:'NOTE' left in text

  - name: python
    args: test.py
    exit: 0
    want: |
      test.py:1:3:vale.Annotations:'FIXME' left in text
      test.py:5:5:vale.Annotations:'FIXME' left in text
      test.py:11:3:vale.Annotations:'XXX' left in text
      test.py:13:16:vale.Annotations:'XXX' left in text
      test.py:14:14:vale.Annotations:'NOTE' left in text
      test.py:28:5:vale.Annotations:'NOTE' left in text
      test.py:35:8:vale.Annotations:'NOTE' left in text
      test.py:37:5:vale.Annotations:'TODO' left in text

  - name: python/shebang
    about: "#631 -- a shebang names an interpreter, so it isn't a comment"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.py]
        BasedOnStyles = Test
      styles/Test/Env.yml: |
        extends: existence
        message: "Use 'environment' rather than 'env'."
        level: error
        tokens:
          - env
      test.py: |
        #!/usr/bin/env python3
        # Read the env before starting.
        print("hello")
    args: test.py
    exit: 1
    want: |
      test.py:2:12:Test.Env:Use 'environment' rather than 'env'.

  - name: cpp
    args: test.cc
    exit: 0
    want: |
      test.cc:1:4:vale.Annotations:'XXX' left in text
      test.cc:9:6:vale.Annotations:'NOTE' left in text
      test.cc:13:6:vale.Annotations:'XXX' left in text
      test.cc:17:5:vale.Annotations:'FIXME' left in text
      test.cc:20:5:vale.Annotations:'XXX' left in text
      test.cc:23:37:vale.Annotations:'XXX' left in text

  - name: scss
    about: "#1019 -- SCSS lints like Sass: comments are prose, selectors,
      values, and strings are code"
    args: test.scss
    exit: 0
    want: |
      test.scss:1:4:vale.Annotations:'NOTE' left in text
      test.scss:8:4:vale.Annotations:'XXX' left in text
      test.scss:18:6:vale.Annotations:'TODO' left in text
      test.scss:37:50:vale.Annotations:'XXX' left in text
    absent:
      - FIXME

  - name: clojure
    args: test.clj
    exit: 0
    want: |
      test.clj:3:6:vale.Annotations:'NOTE' left in text
      test.clj:5:15:vale.Annotations:'TODO' left in text
      test.clj:7:6:vale.Annotations:'FIXME' left in text
      test.clj:9:11:vale.Annotations:'XXX' left in text

  - name: jsx
    args: test.jsx
    exit: 0
    want: |
      test.jsx:1:4:vale.Annotations:'XXX' left in text
      test.jsx:4:6:vale.Annotations:'NOTE' left in text
      test.jsx:14:3:vale.Annotations:'XXX' left in text
      test.jsx:18:37:vale.Annotations:'TODO' left in text

  - name: markdown
    args: test.md
    exit: 0
    want: |
      test.md:3:1:vale.Annotations:'NOTE' left in text
      test.md:32:1:vale.Annotations:'XXX' left in text
      test.md:34:29:vale.Annotations:'TODO' left in text
      test.md:36:3:vale.Annotations:'TODO' left in text
      test.md:36:10:vale.Annotations:'XXX' left in text
      test.md:36:16:vale.Annotations:'FIXME' left in text
      test.md:40:21:vale.Annotations:'FIXME' left in text
      test.md:44:5:vale.Annotations:'TODO' left in text
      test.md:46:3:vale.Annotations:'TODO' left in text

  - name: rmarkdown
    about: .Rmd is Markdown out of the box -- knitr chunk fences and inline
      `r` spans are code, and everything else lints as prose
    args: test.Rmd
    exit: 0
    want: |
      test.Rmd:19:47:vale.Annotations:'TODO' left in text
      test.Rmd:35:25:vale.Annotations:'XXX' left in text
      test.Rmd:52:23:vale.Annotations:'TODO' left in text
      test.Rmd:58:32:vale.Annotations:'NOTE' left in text
    absent:
      - FIXME

  - name: myst
    about: "#667 -- MyST-only syntax is markup, not prose: targets, roles,
      comments, options, and block breaks say nothing, directive content is
      linted, and literal directives stay skipped"
    args: test.myst
    exit: 0
    want: |
      test.myst:13:19:vale.Annotations:'TODO' left in text
      test.myst:29:26:vale.Annotations:'XXX' left in text
      test.myst:33:19:vale.Annotations:'TODO' left in text
      test.myst:38:30:vale.Annotations:'XXX' left in text
      test.myst:46:37:vale.Annotations:'TODO' left in text
      test.myst:68:31:vale.Annotations:'XXX' left in text
      test.myst:77:53:vale.Annotations:'TODO' left in text
      test.myst:84:6:vale.Annotations:'XXX' left in text
      test.myst:86:23:vale.Annotations:'TODO' left in text
      test.myst:97:7:vale.Annotations:'XXX' left in text
    absent:
      - FIXME
      - NOTE

  - name: typst
    about: "#651 -- Typst parses through typst2vast, the compiler's own
      parser without its evaluator: markup is prose, code mode is masked,
      and a content block anywhere inside code is prose again"
    args: test.typ
    requires: typst2vast
    exit: 0
    want: |
      test.typ:12:27:vale.Annotations:'TODO' left in text
      test.typ:17:19:vale.Annotations:'TODO' left in text
      test.typ:17:59:vale.Annotations:'XXX' left in text
      test.typ:18:22:vale.Annotations:'TODO' left in text
      test.typ:36:37:vale.Annotations:'TODO' left in text
      test.typ:40:18:vale.Annotations:'XXX' left in text
      test.typ:42:22:vale.Annotations:'TODO' left in text
      test.typ:45:27:vale.Annotations:'XXX' left in text
      test.typ:48:40:vale.Annotations:'TODO' left in text
      test.typ:55:29:vale.Annotations:'XXX' left in text
      test.typ:58:65:vale.Annotations:'XXX' left in text
    absent:
      - FIXME
      - NOTE

  - name: typst-scopes
    about: Typst's headings, styled spans, raw text, and list items land in
      their Vale scopes
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.typ]
        T.Head = YES
        T.Strong = YES
        T.Code = YES
        T.List = YES
      styles/T/Head.yml: |
        extends: existence
        message: heading
        level: error
        nonword: true
        scope: heading
        raw:
          - ZQX
      styles/T/Strong.yml: |
        extends: existence
        message: strong
        level: error
        nonword: true
        scope: strong
        raw:
          - ZQX
      styles/T/Code.yml: |
        extends: existence
        message: code
        level: error
        nonword: true
        scope: code
        raw:
          - ZQX
      styles/T/List.yml: |
        extends: existence
        message: list
        level: error
        nonword: true
        scope: list
        raw:
          - ZQX
      test.typ: |
        = A heading with ZQX inside

        Plain prose with *a strong ZQX span* and `a raw ZQX span` inline.

        - A list item with ZQX inside.
    args: test.typ
    requires: typst2vast
    exit: 1
    want: |
      test.typ:1:18:T.Head:heading
      test.typ:3:28:T.Strong:strong
      test.typ:3:49:T.Code:code
      test.typ:5:20:T.List:list

  - name: qdoc
    about: "#784 -- QDoc's commands are markup: topic lines, code blocks,
      links' targets, and options say nothing, while titles, sections,
      briefs, notes, items, cells, and captions are prose. A command may
      share the opening `/*!` line; a conditional block's prose, a
      deprecation's advice, and a summary still count; and modifiers, cell
      spans, version qualifiers, and snippet markers say nothing"
    args: test.qdoc
    exit: 0
    want: |
      test.qdoc:3:32:vale.Annotations:'TODO' left in text
      test.qdoc:5:29:vale.Annotations:'XXX' left in text
      test.qdoc:7:23:vale.Annotations:'TODO' left in text
      test.qdoc:8:8:vale.Annotations:'XXX' left in text
      test.qdoc:10:40:vale.Annotations:'TODO' left in text
      test.qdoc:14:32:vale.Annotations:'XXX' left in text
      test.qdoc:17:32:vale.Annotations:'TODO' left in text
      test.qdoc:25:26:vale.Annotations:'XXX' left in text
      test.qdoc:30:39:vale.Annotations:'XXX' left in text
      test.qdoc:33:36:vale.Annotations:'TODO' left in text
      test.qdoc:36:46:vale.Annotations:'XXX' left in text
      test.qdoc:38:47:vale.Annotations:'TODO' left in text
      test.qdoc:48:34:vale.Annotations:'TODO' left in text
      test.qdoc:67:37:vale.Annotations:'XXX' left in text
      test.qdoc:69:27:vale.Annotations:'TODO' left in text
      test.qdoc:73:61:vale.Annotations:'XXX' left in text
      test.qdoc:78:33:vale.Annotations:'TODO' left in text
      test.qdoc:97:53:vale.Annotations:'XXX' left in text
      test.qdoc:99:32:vale.Annotations:'TODO' left in text
      test.qdoc:100:24:vale.Annotations:'XXX' left in text
      test.qdoc:105:53:vale.Annotations:'TODO' left in text
      test.qdoc:108:35:vale.Annotations:'XXX' left in text
      test.qdoc:108:70:vale.Annotations:'TODO' left in text
      test.qdoc:113:45:vale.Annotations:'TODO' left in text
      test.qdoc:116:51:vale.Annotations:'XXX' left in text
      test.qdoc:120:45:vale.Annotations:'TODO' left in text
      test.qdoc:122:42:vale.Annotations:'XXX' left in text
    absent:
      - FIXME
      - NOTE

  - name: qdoc-line-accuracy
    about: an alert keeps its source line through the constructs a real Qt
      page is built from -- a link split across lines, snippet markers,
      custom macros, and a snippet reference
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        T.Mark = YES
      styles/T/Mark.yml: |
        extends: existence
        message: "'%s'"
        level: error
        nonword: true
        raw:
          - MARK[A-E]
      crosslink.qdoc: |
        /*!
            \page qt-edu-for-designers.html
            \title Qt Edu for Designers

        //! [intro]
            \e {Qt Edu for Designers} package contains \l {Qt Design Studio Manual}
            {Qt Design Studio Enterprise}, allowing you to MARKA import.
        //! [intro]

            These instructions walk you through the installation.

            \include qt-edu-steps.qdocinc {qt-edu-common-steps} {Qt Design Studio}

            \image qt-edu-install-design-studio.png

            With \e {Qt Edu for Designers} license, you get access to Qt Design
            Studio. Select the \uicontrol {Design Tools} shortcut to install.

            Select \uicontrol {Next}.

            \include qt-edu-steps.qdocinc qt-edu-license-agreement

            \section1 9. Finish the installation

            Select \uicontrol {Install} to start the installation process.

            Once installation is complete, you'll see the screen.

            \image qt-edu-install-finish-design-studio.png

            Select \uicontrol {Finish} to exit the installer.

            \section1 10. Open Qt Design Studio

            Go to the MARKB folder to see the tools that were installed.
            Qt Design Studio is MARKC located under its own folder.
        */
      macros.qdoc: |
        /*!
            \class Example
            \brief A brief description.

            This works on \macos and \linux MARKA platforms.
            The \QUL framework handles MARKB rendering accordingly.
            Final sentence after MARKC macros.
        */
      markers.qdoc: |
        /*!
        //! [intro]
            Prose line MARKA three.
        //! [intro]

            Prose line MARKB six.
        */
      snippet.qdoc: |
        /*!
            \class Loader
            \brief Loads resources.

            Use the loader as follows:
            \snippet examples/loader.cpp setup
            Prose after MARKA snippet should be included.
        */
    args: .
    exit: 1
    want: |
      crosslink.qdoc:7:52:T.Mark:'MARKA'
      crosslink.qdoc:35:15:T.Mark:'MARKB'
      crosslink.qdoc:36:25:T.Mark:'MARKC'
      macros.qdoc:5:37:T.Mark:'MARKA'
      macros.qdoc:6:32:T.Mark:'MARKB'
      macros.qdoc:7:26:T.Mark:'MARKC'
      markers.qdoc:3:16:T.Mark:'MARKA'
      markers.qdoc:6:16:T.Mark:'MARKB'
      snippet.qdoc:7:17:T.Mark:'MARKA'

  - name: qdoc-toggles
    about: "`vale off` and `vale on` work in QDoc, as an HTML comment and
      through `CommentDelimiters`, even though the prose around them may
      talk about markup"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.qdoc]
        T.Tok = YES
        CommentDelimiters = [[, ]]
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s'"
        level: error
        nonword: true
        raw:
          - ZQX
      t.qdoc: |
        /*!
            A ZQX before, in a <script> tag sentence.

            <!-- vale off -->
            A ZQX an HTML comment suppresses.
            <!-- vale on -->

            [[ vale off ]]
            A ZQX custom delimiters suppress.
            [[ vale on ]]

            A ZQX after.
        */
    args: t.qdoc
    exit: 1
    want: |
      t.qdoc:2:7:T.Tok:'ZQX'
      t.qdoc:12:7:T.Tok:'ZQX'

  - name: qdoc-classes
    about: "`.qdocinc` is QDoc without configuration, and `\\div` and `\\span`
      carry their class into the scope so a rule can target the prose they
      hold"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        T.Sidebar = YES
        T.Header = YES
      styles/T/Sidebar.yml: |
        extends: existence
        message: "'%s' in the sidebar"
        scope: class.sidebar
        level: error
        nonword: true
        raw:
          - ZQX
      styles/T/Header.yml: |
        extends: existence
        message: "'%s' in a header span"
        scope: class.vrheader
        level: error
        nonword: true
        raw:
          - ZQX
      api.qdocinc: |
        /*!
            \div {class="sidebar"}
            A ZQX inside the classed div.
            \enddiv

            A plain paragraph whose ZQX belongs to neither class.

            The \span {class="vrheader"} {ZQX in a span} is scoped too.
        */
    args: api.qdocinc
    exit: 1
    want: |
      api.qdocinc:3:7:T.Sidebar:'ZQX' in the sidebar
      api.qdocinc:8:35:T.Header:'ZQX' in a header span

  - name: html-data
    about: "`data` holds machine-readable content in any markup format, not
      only QDoc: an ordinary rule passes over it"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        T.Prose = YES
        T.Meta = YES
      styles/T/Prose.yml: |
        extends: existence
        message: "'%s' as prose"
        level: error
        nonword: true
        raw:
          - ZQX
      styles/T/Meta.yml: |
        extends: existence
        message: "'%s' as metadata"
        scope: meta
        level: error
        nonword: true
        raw:
          - ZQX
      page.html: |
        <p>A ZQX in a paragraph.</p>
        <data value="1">ZQX-identifier</data>
    args: page.html
    exit: 1
    want: |
      page.html:1:6:T.Prose:'ZQX' as prose
      page.html:2:17:T.Meta:'ZQX' as metadata

  - name: qdoc-meta
    about: "anchor names and image file names are a document's machine-readable
      content: an ordinary rule passes over them, and only a rule scoped to
      `meta` reaches one"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        T.Prose = YES
        T.Anchor = YES
        T.Image = YES
      styles/T/Prose.yml: |
        extends: existence
        message: "'%s' as prose"
        level: error
        nonword: true
        raw:
          - ZQX
      styles/T/Anchor.yml: |
        extends: existence
        message: "'%s' in an anchor"
        scope: meta.class.anchor
        level: error
        nonword: true
        raw:
          - ZQX
      styles/T/Image.yml: |
        extends: existence
        message: "'%s' in a file name"
        scope: meta.class.image
        level: error
        nonword: true
        raw:
          - ZQX
      anchors.qdoc: |
        /*!
            \target ZQX-anchor
            \keyword {ZQX Keyword}

            A ZQX in ordinary prose.

            \image ZQX-diagram.png A caption with a ZQX in it.
        */
    args: anchors.qdoc
    exit: 1
    want: |
      anchors.qdoc:2:13:T.Anchor:'ZQX' in an anchor
      anchors.qdoc:3:15:T.Anchor:'ZQX' in an anchor
      anchors.qdoc:5:7:T.Prose:'ZQX' as prose
      anchors.qdoc:7:12:T.Image:'ZQX' in a file name
      anchors.qdoc:7:45:T.Prose:'ZQX' as prose

  - name: qdoc-image-alt
    about: "an image's file name is `meta` whether or not alt text follows, so a
      rule about naming sees every image; the ones missing alt text carry a
      second class, so a rule can ask for those alone. See #784."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.qdoc]
        T.NoAlt = YES
        T.Name = YES
      styles/T/NoAlt.yml: |
        extends: existence
        message: "'%s' is missing alt text"
        scope: meta.class.noalt
        level: error
        nonword: true
        raw:
          - '\S+'
      styles/T/Name.yml: |
        extends: existence
        message: "'%s' is an image"
        scope: meta.class.image
        level: suggestion
        nonword: true
        raw:
          - '\S+'
      images.qdoc: |
        /*!
            \image bare.png

            \inlineimage inline-bare.png

            \image described.png A caption of prose.

            \image marked-up.png The \e main toolbar.

            Text with \inlineimage trailing.png and more of the sentence.
        */
    args: images.qdoc
    exit: 1
    want: |
      images.qdoc:2:12:T.Name:'bare.png' is an image
      images.qdoc:2:12:T.NoAlt:'bare.png' is missing alt text
      images.qdoc:4:18:T.Name:'inline-bare.png' is an image
      images.qdoc:4:18:T.NoAlt:'inline-bare.png' is missing alt text
      images.qdoc:6:12:T.Name:'described.png' is an image
      images.qdoc:8:12:T.Name:'marked-up.png' is an image
      images.qdoc:10:28:T.Name:'trailing.png' is an image

  - name: qdoc-fragments
    about: doc comments in C++ sources lint as QDoc through `[formats]`, with
      alerts mapped back to the source; only `/*!` is documentation, while
      line comments and plain block comments are code
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [formats]
        cpp = qdoc

        [*.cpp]
        T.Tok = YES
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s' in a doc comment"
        level: error
        nonword: true
        raw:
          - ZQX
      widget.cpp: |
        #include "widget.h"

        /*!
            \fn void Widget::clicked()

            This signal has a ZQX in its prose.

            \note The note has a ZQX too, and \c {a ZQX in code} does not count.
        */
        void Widget::clicked() {}

        // A ZQX in a line comment is code, not documentation.

        /*
            A plain block comment with a ZQX is code too.
        */

        /****************************************************
        ** A ZQX in a license header is not documentation.
        ****************************************************/
        void Widget::other() {}
    args: widget.cpp
    exit: 1
    want: |
      widget.cpp:6:23:T.Tok:'ZQX' in a doc comment
      widget.cpp:8:26:T.Tok:'ZQX' in a doc comment

  - name: qdocinc-include
    about: "a `.qdocinc` is an include, not a file of comments: its markup is
      the body of one, so nothing waits for a `/*!` that the file never
      writes, and a `//! [name]` marker is still markup"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.qdocinc]
        T.Tok = YES
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s'"
        level: error
        nonword: true
        raw:
          - ZQX
      steps.qdocinc: |
        //! [intro]
            \note A ZQX in an included note.
        //! [intro]

        A ZQX in an included paragraph.
      wrapped.qdocinc: |
        /*!
            A ZQX in an include that writes the comment out.
        */
    args: .
    exit: 1
    want: |
      steps.qdocinc:2:13:T.Tok:'ZQX'
      steps.qdocinc:5:3:T.Tok:'ZQX'
      wrapped.qdocinc:2:7:T.Tok:'ZQX'

  - name: qdoc-meta-in-source
    about: "the same comment lints the same way wherever it is written: an
      image file name is `meta` in a C++ source as much as in a `.qdoc` file,
      so an ordinary rule passes over it and a `meta` rule reaches it"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [formats]
        cpp = qdoc

        [*.{qdoc,cpp}]
        T.Prose = YES
        T.Image = YES
      styles/T/Prose.yml: |
        extends: existence
        message: "'%s' as prose"
        level: error
        nonword: true
        raw:
          - ZQX
      styles/T/Image.yml: |
        extends: existence
        message: "'%s' in a file name"
        scope: meta.class.image
        level: error
        nonword: true
        raw:
          - ZQX
      same.qdoc: |
        /*!
            \image ZQX-diagram.png A caption with a ZQX in it.
        */
      widget.cpp: |
        #include "widget.h"

        /*!
            \image ZQX-diagram.png A caption with a ZQX in it.
        */
        void Widget::clicked() {}
    args: .
    exit: 1
    want: |
      same.qdoc:2:12:T.Image:'ZQX' in a file name
      same.qdoc:2:45:T.Prose:'ZQX' as prose
      widget.cpp:4:12:T.Image:'ZQX' in a file name
      widget.cpp:4:45:T.Prose:'ZQX' as prose

  - name: qml-fragments
    about: doc comments in QML sources lint as QDoc through `[formats]`;
      the QML code itself -- objects, bindings, functions, strings, line
      comments, and snippet markers -- is never prose
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [formats]
        qml = qdoc

        [*.qml]
        T.Tok = YES
        T.Note = YES
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s' in a doc comment"
        level: error
        nonword: true
        raw:
          - ZQX
      styles/T/Note.yml: |
        extends: existence
        message: "'%s' in a note"
        scope: class.note
        level: error
        nonword: true
        tokens:
          - ZQX
      Slider.qml: |
        import QtQuick

        /*!
            \qmltype Slider
            \inqmlmodule Custom.Controls
            \brief A ZQX in the brief.

            A ZQX in body prose. Another sentence follows it.

            \section1 A ZQX heading

            \code
            Slider { value: ZQX }
            \endcode

            \note A ZQX in a note.
        */
        Item {
            id: root

            //! [0]
            // A ZQX in a line comment stays code.
            property real value: 0 // a trailing ZQX comment is code too
            //! [0]

            /*
                A ZQX in a plain block comment is code as well.
            */
            function formatValue(v) {
                var label = "a ZQX in a string is code";
                return label + v;
            }

            /*!
                \qmlproperty real Slider::value
                A second block: its ZQX follows a topic line.
            */
        }
    args: Slider.qml
    exit: 1
    want: |
      Slider.qml:6:14:T.Tok:'ZQX' in a doc comment
      Slider.qml:8:7:T.Tok:'ZQX' in a doc comment
      Slider.qml:10:17:T.Tok:'ZQX' in a doc comment
      Slider.qml:16:13:T.Note:'ZQX' in a note
      Slider.qml:16:13:T.Tok:'ZQX' in a doc comment
      Slider.qml:36:29:T.Tok:'ZQX' in a doc comment

