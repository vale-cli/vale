      test.dita:6:44:T.Rain:found 'rains'

  - name: dita-many-files
    about: "Every DITA file of a run is converted in one toolkit run, through
      a map written in their common directory, since starting the toolkit
      costs more than converting a file. A nested topic and one an ignore
      pattern changes are converted the same way."
    requires: dita
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        TokenIgnores = (\[.+\])

        [*.dita]
        BasedOnStyles = T
      styles/T/Rain.yml: |
        extends: existence
        message: "found '%s'"
        level: error
        tokens:
          - rains
      docs/a.dita: |
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE topic PUBLIC "-//OASIS//DTD DITA Topic//EN" "topic.dtd">
        <topic id="a">
          <title>A</title>
          <body>
            <p>It rains in A.</p>
          </body>
        </topic>
      docs/sub/b.dita: |
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE topic PUBLIC "-//OASIS//DTD DITA Topic//EN" "topic.dtd">
        <topic id="b">
          <title>B</title>
          <body>
            <p>[if it rains] then it rains in B.</p>
          </body>
        </topic>
    args: --output=line --no-exit docs
    exit: 0
    want: |
      docs/a.dita:6:11:T.Rain:found 'rains'
      docs/sub/b.dita:6:30:T.Rain:found 'rains'

  - name: url-in-code-comment
    about: "A URL is never prose. In a code comment it is blanked before
      the comment is linted, as a converter already keeps one out of the
      text of a markup file."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        BasedOnStyles = Vale, T
      styles/T/Any.yml: |
        extends: existence
        message: "saw '%s'"
        level: error
        tokens:
          - foobarbaz
      doc.go: |
        package x

        // See https://example.com/foobarbaz-qux for detials.
        var x = 1
    args: --output=line --no-exit doc.go
    exit: 0
    want: |
      doc.go:3:46:Vale.Spelling:Did you really mean 'detials'?

  - name: rst-url-and-link-text
    about: "A reStructuredText link's text is linted where it is written,
      and a bare URL is not linted at all. A spelling alert is placed by
      the block's own position, so a word in link text is no longer found
      inside the URL that follows it."
    requires: rst2html
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        BasedOnStyles = Vale, T
      styles/T/Any.yml: |
        extends: existence
        message: "saw '%s'"
        level: error
        tokens:
          - foobarbaz
      doc.rst: |
        See `foobarbaz text <https://example.com/foobarbaz-qux>`_ and https://example.com/foobarbaz-qux here.
    args: --output=line --no-exit doc.rst
    exit: 0
    want: |
      doc.rst:1:6:T.Any:saw 'foobarbaz'
      doc.rst:1:6:Vale.Spelling:Did you really mean 'foobarbaz'?

