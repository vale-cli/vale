  - name: comment-delimiters-in-prose
    about: "A delimiter character inside a comment's prose -- the `//` of a
      URL, the `#` of a Markdown heading -- is content, not decoration. Every
      occurrence used to be stripped, shifting each alert after one left by
      its width."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        T.Marker = YES
      styles/T/Marker.yml: |
        extends: existence
        message: "'%s' left in text"
        level: error
        tokens:
          - XXX
      test.go: |
        package main

        // See https://example.com for XXX details.
        func main() {}
      test.py: |
        # Use the #id selector XXX here.
        ## A banner comment, XXX included.
      test.ex: |
        defmodule M do
          @moduledoc """
          Does things.

          ## Examples XXX

              M.run()
          """
        end
    args: test.go test.py test.ex
    exit: 1
    want: |
      test.ex:5:15:T.Marker:'XXX' left in text
      test.go:3:32:T.Marker:'XXX' left in text
      test.py:1:24:T.Marker:'XXX' left in text
      test.py:2:22:T.Marker:'XXX' left in text

  - name: br-separates-text
    about: "#1157 -- a self-closing `<br/>` arrived as a token type no branch
      handled, so the text on either side fused: `sentence.<br/><br/>This`
      read as `sentence.This`, and rules matched across the seam."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.md]
        T.Spacing = YES
      styles/T/Spacing.yml: |
        extends: existence
        message: "No space at '%s'."
        level: error
        nonword: true
        tokens:
          - '[a-z][.?!,][A-Z]'
      test.md: |
        A first line.<br/>A second line.

        | Column  | Description |
        |---------|-------------|
        | Example | This is the first sentence.<br/><br/>This is the second sentence. |

        A real mistake.Right here.
    args: test.md
    exit: 1
    want: |
      test.md:7:14:T.Spacing:No space at 'e.R'.
