  - name: quarto-math
    about: "#839 -- inline `$…$` math is skipped like display math, but only
      under Pandoc's delimiter rules, so `$5 and $10` stays prose"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.qmd]
        BasedOnStyles = T
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s' found"
        level: error
        nonword: true
        raw:
          - ZQX
      test.qmd: |
        Inline $ZQX$ is math.

        So is $ZQX = f(ZQX)$, spaces and all.

        And $ZQX =
        f(ZQX)$ wrapped across lines.

        $$
        ZQX = f(ZQX)
        $$

        It costs $5 and ZQX $10 today.

        A lone $5 leaves ZQX alone.

        Escaped \$5 and \$10 leave ZQX alone.
    args: test.qmd
    exit: 1
    want: |
      test.qmd:12:17:T.Tok:'ZQX' found
      test.qmd:14:18:T.Tok:'ZQX' found
      test.qmd:16:28:T.Tok:'ZQX' found

  - name: math-closing-delimiter
    about: "#1148 -- a closing `$$` need not be alone on its line. Each of
      these is display math to Pandoc, so the prose after it is still prose,
      and an unclosed block ends at a blank line instead of consuming the
      rest of the file"
    files:
      .vale.ini: |
        MinAlertLevel = suggestion

        [*.md]
        BasedOnStyles = Vale
      single-line.md: |
        A speling error before the math.

        $$x=1$$

        Another speling error after it.
      labelled.md: |
        A speling error before the math.

        $$
        x=1
        $$ {#eq-foo}

        Another speling error after it.
      env.md: |
        A speling error before the math.

        $$\begin{aligned}
        x &= 1
        \end{aligned}$$

        Another speling error after it.
      unclosed.md: |
        A speling error before the math.

        $$
        x=1

        Another speling error after it.
      adjacent.md: |
        A speling error before the math.

        $$
        x = speling
        $$
        $$
        y = 2
        $$

        Another speling error after it.
    args: single-line.md labelled.md env.md unclosed.md adjacent.md
    exit: 1
    want: |
      adjacent.md:1:3:Vale.Spelling:Did you really mean 'speling'?
      adjacent.md:10:9:Vale.Spelling:Did you really mean 'speling'?
      env.md:1:3:Vale.Spelling:Did you really mean 'speling'?
      env.md:7:9:Vale.Spelling:Did you really mean 'speling'?
      labelled.md:1:3:Vale.Spelling:Did you really mean 'speling'?
      labelled.md:7:9:Vale.Spelling:Did you really mean 'speling'?
      single-line.md:1:3:Vale.Spelling:Did you really mean 'speling'?
      single-line.md:5:9:Vale.Spelling:Did you really mean 'speling'?
      unclosed.md:1:3:Vale.Spelling:Did you really mean 'speling'?
      unclosed.md:6:9:Vale.Spelling:Did you really mean 'speling'?

