      - NOTE

  - name: typst
    about: "#651 -- Typst parses through typst2vast, the compiler's own
      parser without its evaluator: markup is prose, code mode is masked,
      and a content block anywhere inside code is prose again"
    args: test.typ
    requires: typst2vast
    exit: 0
    want: |
      test.typ:12:27:vale.Annotations:'TODO' left in text
      test.typ:17:19:vale.Annotations:'TODO' left in text
      test.typ:17:59:vale.Annotations:'XXX' left in text
      test.typ:18:22:vale.Annotations:'TODO' left in text
      test.typ:36:37:vale.Annotations:'TODO' left in text
      test.typ:40:18:vale.Annotations:'XXX' left in text
      test.typ:42:22:vale.Annotations:'TODO' left in text
      test.typ:45:27:vale.Annotations:'XXX' left in text
      test.typ:48:40:vale.Annotations:'TODO' left in text
      test.typ:55:29:vale.Annotations:'XXX' left in text
      test.typ:58:65:vale.Annotations:'XXX' left in text
    absent:
      - FIXME
      - NOTE

  - name: typst-scopes
    about: Typst's headings, styled spans, raw text, and list items land in
      their Vale scopes
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.typ]
        T.Head = YES
        T.Strong = YES
        T.Code = YES
        T.List = YES
      styles/T/Head.yml: |
        extends: existence
        message: heading
        level: error
        nonword: true
        scope: heading
        raw:
          - ZQX
      styles/T/Strong.yml: |
        extends: existence
        message: strong
        level: error
        nonword: true
        scope: strong
        raw:
          - ZQX
      styles/T/Code.yml: |
        extends: existence
        message: code
        level: error
        nonword: true
        scope: code
        raw:
          - ZQX
      styles/T/List.yml: |
        extends: existence
        message: list
        level: error
        nonword: true
        scope: list
        raw:
          - ZQX
      test.typ: |
        = A heading with ZQX inside

        Plain prose with *a strong ZQX span* and `a raw ZQX span` inline.

        - A list item with ZQX inside.
    args: test.typ
    requires: typst2vast
    exit: 1
    want: |
      test.typ:1:18:T.Head:heading
      test.typ:3:28:T.Strong:strong
      test.typ:3:49:T.Code:code
      test.typ:5:20:T.List:list

  - name: qdoc
    about: "#784 -- QDoc's commands are markup: topic lines, code blocks,
      links' targets, and options say nothing, while titles, sections,
      briefs, notes, items, cells, and captions are prose"
    args: test.qdoc
    exit: 0
    want: |
      test.qdoc:3:32:vale.Annotations:'TODO' left in text
      test.qdoc:5:29:vale.Annotations:'XXX' left in text
      test.qdoc:7:23:vale.Annotations:'TODO' left in text
      test.qdoc:8:8:vale.Annotations:'XXX' left in text
      test.qdoc:10:40:vale.Annotations:'TODO' left in text
      test.qdoc:14:32:vale.Annotations:'XXX' left in text
      test.qdoc:17:32:vale.Annotations:'TODO' left in text
      test.qdoc:25:26:vale.Annotations:'XXX' left in text
      test.qdoc:30:39:vale.Annotations:'XXX' left in text
      test.qdoc:33:36:vale.Annotations:'TODO' left in text
      test.qdoc:36:46:vale.Annotations:'XXX' left in text
      test.qdoc:38:47:vale.Annotations:'TODO' left in text
    absent:
      - FIXME
      - NOTE

  - name: qdoc-fragments
    about: doc comments in C++ sources lint as QDoc through `[formats]`, with
      alerts mapped back to the source
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [formats]
        cpp = qdoc

        [*.cpp]
        T.Tok = YES
      styles/T/Tok.yml: |
        extends: existence
        message: "'%s' in a doc comment"
        level: error
        nonword: true
        raw:
          - ZQX
      widget.cpp: |
        #include "widget.h"

        /*!
            \fn void Widget::clicked()

            This signal has a ZQX in its prose.

            \note The note has a ZQX too, and \c {a ZQX in code} does not count.
        */
        void Widget::clicked() {}
    args: widget.cpp
    exit: 1
    want: |
      widget.cpp:6:23:T.Tok:'ZQX' in a doc comment
      widget.cpp:8:26:T.Tok:'ZQX' in a doc comment

  - name: quarto
    about: "#793 -- fenced divs, attributes, and shortcodes are markup, div
      content is linted, and code cells stay skipped, options and all"
    args: test.qmd
    exit: 0
    want: |
      test.qmd:12:19:vale.Annotations:'TODO' left in text
      test.qmd:23:23:vale.Annotations:'XXX' left in text
      test.qmd:25:22:vale.Annotations:'TODO' left in text
      test.qmd:29:23:vale.Annotations:'XXX' left in text
      test.qmd:35:26:vale.Annotations:'TODO' left in text
      test.qmd:45:25:vale.Annotations:'XXX' left in text
      test.qmd:50:60:vale.Annotations:'TODO' left in text
      test.qmd:53:9:vale.Annotations:'XXX' left in text
    absent:
      - FIXME
      - NOTE

  - name: quarto-callout-scope
    about: a fenced div's classes scope its content, so a rule can target a
      callout by name
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.qmd]
        BasedOnStyles = T
      styles/T/InCallout.yml: |
        extends: existence
        message: "'%s' in a callout"
        level: error
        nonword: true
        scope: class.callout-note
        raw:
          - ZQX
      test.qmd: |
        A paragraph with ZQX is not matched.

        ::: {.callout-note}
        First callout paragraph with ZQX.

        Second callout paragraph with ZQX too.
        :::

        ::: {.callout-tip}
        A different callout with ZQX.
        :::
    args: test.qmd
    exit: 1
    want: |
      test.qmd:4:30:T.InCallout:'ZQX' in a callout
      test.qmd:6:31:T.InCallout:'ZQX' in a callout

  - name: myst-mapped
    about: a Markdown file opts into MyST with `[formats] md = myst`, and a
      directive's name scopes its content as a class
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [formats]
        md = myst

        [*.md]
        BasedOnStyles = T
      styles/T/InNote.yml: |
        extends: existence
        message: "'%s' in a note"
        level: error
        nonword: true
        scope: class.note
        raw:
          - ZQX
      test.md: |
        A paragraph with ZQX is not matched.

        (a-label-with-ZQX)=

        ```{note}
        First note paragraph with ZQX.

        Second note paragraph with ZQX too.
        ```

        :::{note}
        A colon-fence note with ZQX.
        :::
    args: test.md
    exit: 1
    want: |
      test.md:6:27:T.InNote:'ZQX' in a note
      test.md:8:28:T.InNote:'ZQX' in a note
      test.md:12:25:T.InNote:'ZQX' in a note

