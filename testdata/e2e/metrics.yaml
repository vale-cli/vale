# The document metrics behind `ls-metrics` and every `metric` rule: what each
# one counts, and which text it counts.
name: metrics
dir: fixtures/metrics/*

cases:
  - name: markdown
    about: paragraphs counts what the `paragraph` scope reaches -- body
      paragraphs alone -- while words and sentences take in every kind of
      prose, and each other element is counted under its own name
    args: ls-metrics test.md
    exit: 0
    want: |
      {
          "automated_readability": 1.64,
          "blockquote": 1,
          "characters": 113,
          "coleman_liau": 2.49,
          "complex_words": 4,
          "dale_chall": 9.65,
          "flesch_kincaid": 4.68,
          "flesch_reading_ease": 67.85,
          "gunning_fog": 7.83,
          "heading_h1": 1,
          "heading_h2": 2,
          "heading_h3": 1,
          "list": 2,
          "lix": 27.57,
          "long_words": 6,
          "paragraphs": 3,
          "polysyllabic_words": 5,
          "quote_words": 0,
          "sentence_length_sd": 2.06,
          "sentences": 7,
          "smog": 7.96,
          "syllables": 40,
          "words": 25
      }

  - name: text
    about: a plain-text file is its own summary, so it has the text metrics,
      a paragraph per run of lines between blank lines, and none of the
      element counts markup provides
    args: ls-metrics test.txt
    exit: 0
    want: |
      {
          "automated_readability": 3.01,
          "characters": 89,
          "coleman_liau": 5.51,
          "complex_words": 3,
          "dale_chall": 7.72,
          "flesch_kincaid": 4.89,
          "flesch_reading_ease": 68.43,
          "gunning_fog": 8.22,
          "lix": 31.07,
          "long_words": 5,
          "paragraphs": 3,
          "polysyllabic_words": 4,
          "quote_words": 0,
          "sentence_length_sd": 2.05,
          "sentences": 4,
          "smog": 8.84,
          "syllables": 30,
          "words": 19
      }

  - name: text-metric-rule
    about: "vale-cli/readability#11 -- a `metric` rule reads a plain-text
      file's summary and fires on it, as it does on Markdown"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.{md,txt}]
        BasedOnStyles = T
      styles/T/Words.yml: |
        extends: metric
        message: "This text has %s words."
        level: warning
        formula: words
        condition: "> 3"
      test.txt: |
        A first paragraph with two sentences in it. The second sentence is here.

        A second paragraph.
      test.md: |
        A first paragraph with two sentences in it. The second sentence is here.

        A second paragraph.
    args: --output=line test.txt test.md
    exit: 0
    want: |
      test.md:1:1:T.Words:This text has 16.00 words.
      test.txt:1:1:T.Words:This text has 16.00 words.

  - name: several
    about: "#1223 -- several paths, or a directory, print an object keyed by
      file, the way `--output=JSON` keys alerts; `--glob` chooses a
      directory's files. One file still prints its metrics alone."
    files:
      a.md: |
        # A

        One short sentence here.
      docs/b.txt: |
        Two words here. And three more words.
      docs/c.md: |
        # B

        Another one.
    args: --glob=*.md ls-metrics a.md docs
    exit: 0
    want: |
      {
          "a.md": {
              "automated_readability": 4.12,
              "characters": 20,
              "coleman_liau": 6.2,
              "complex_words": 0,
              "dale_chall": 4.15,
              "flesch_kincaid": 0.72,
              "flesch_reading_ease": 97.03,
              "gunning_fog": 1.6,
              "heading_h1": 1,
              "lix": 29,
              "long_words": 1,
              "paragraphs": 1,
              "polysyllabic_words": 0,
              "quote_words": 0,
              "sentence_length_sd": 0,
              "sentences": 1,
              "smog": 3.13,
              "syllables": 5,
              "words": 4
          },
          "docs/c.md": {
              "automated_readability": 3.12,
              "characters": 10,
              "coleman_liau": -1.2,
              "complex_words": 1,
              "dale_chall": 7.99,
              "flesch_kincaid": 8.79,
              "flesch_reading_ease": 35.61,
              "gunning_fog": 20.8,
              "heading_h1": 1,
              "lix": 52,
              "long_words": 1,
              "paragraphs": 1,
              "polysyllabic_words": 1,
              "quote_words": 0,
              "sentence_length_sd": 0,
              "sentences": 1,
              "smog": 8.84,
              "syllables": 4,
              "words": 2
          }
      }

  - name: missing-path
    about: a path that isn't there is named, before anything is read
    files:
      a.md: |
        Here.
    args: ls-metrics a.md nope.md
    exit: 2
    contains: |
      [ls-metrics]:E100:'nope.md' not found

  - name: empty-directory
    about: the argument only has to exist, and a directory does -- so one
      whose every file is skipped (`node_modules` is ignored by default)
      lints to nothing, and saying so beats indexing an empty result, which
      used to panic
    files:
      empty/node_modules/test.md: |
        # Title
    args: ls-metrics empty
    exit: 2
    contains: |
      [ls-metrics]:E100:'empty' contains no lintable files

  - name: formula
    about: "a `metric` rule reads the same counts -- the weighted total spells
      them out, so 221 means 2 H2s, 2 list items, and 1 blockquote -- and the
      readability scores, which `round` rounds to the places asked for"
    args: .
    exit: 0
    want: |
      test.md:1:1:M.Counts:counts: 221.00
      test.md:1:1:M.Grade:grade: 4.70

  - name: scoped
    about: "a `metric` or `readability` rule measures whatever block its scope
      hands it: a heading, a paragraph, a list item, a sentence, a `doc(...)`
      selection, or -- with no scope -- the summary. A selection counts the
      elements it holds, subheadings included, and the alert lands on the
      block's first line -- except a sentence's, which lands where the
      sentence begins, so the second long sentence of a paragraph is not
      dropped as a duplicate of the first. The Dense section reads harder
      than the file it sits in."
    args: test.md
    exit: 0
    want: |
      test.md:1:1:M.Heading:A heading of 5.00 words. The budget is 4.
      test.md:1:1:M.Whole:The file has 3.00 H2s.
      test.md:5:1:M.Section:A section of 38.00 words. The budget is 35.
      test.md:5:1:M.Subheadings:A section with 2.00 subheadings. One is the limit.
      test.md:7:1:M.Paragraph:A paragraph of 31.00 words. The budget is 30.
      test.md:7:1:M.Sentence:A sentence of 31.00 words. The budget is 12.
      test.md:17:1:M.Grade:Dense reads at grade 11.23. Aim below 10.
      test.md:20:1:M.ListItem:A list item of 21.00 words. The budget is 12.
      test.md:20:3:M.Sentence:A sentence of 21.00 words. The budget is 12.
      test.md:26:1:M.Band:A sentence of 14.00 words, in the 13-to-19 band.
      test.md:26:1:M.Sentence:A sentence of 14.00 words. The budget is 12.
      test.md:26:82:M.Band:A sentence of 15.00 words, in the 13-to-19 band.
      test.md:26:82:M.Sentence:A sentence of 15.00 words. The budget is 12.

  - name: scoped-text
    dir: scoped
    about: "plain text is one block with no line of its own, and its paragraphs
      and sentences inherit that, so each is placed by its offset in the
      file's content: it lands where it begins, the same as in Markdown. A
      condition reads its formula's value as `result`, so Band holds both
      ends of a range without repeating the formula."
    args: test.txt
    exit: 0
    want: |
      test.txt:3:1:M.Band:A sentence of 14.00 words, in the 13-to-19 band.
      test.txt:3:1:M.Sentence:A sentence of 14.00 words. The budget is 12.
      test.txt:3:82:M.Band:A sentence of 15.00 words, in the 13-to-19 band.
      test.txt:3:82:M.Sentence:A sentence of 15.00 words. The budget is 12.
      test.txt:5:1:M.Paragraph:A paragraph of 31.00 words. The budget is 30.
      test.txt:5:1:M.Sentence:A sentence of 31.00 words. The budget is 12.
