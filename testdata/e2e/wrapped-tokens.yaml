# A phrase in a rule matches across a line wrap: a space in a token or a
# swap key matches the whitespace a wrapped paragraph puts there. See #1215.
name: wrapped-tokens

files:
  .vale.ini: |
    StylesPath = styles
    MinAlertLevel = suggestion

    [*.md]
    BasedOnStyles = T
  styles/T/Phrase.yml: |
    extends: existence
    message: "found '%s'"
    level: warning
    ignorecase: true
    tokens:
      - for example
  styles/T/Swap.yml: |
    extends: substitution
    message: "use '%s' instead of '%s'"
    level: warning
    ignorecase: true
    swap:
      in order to: to
  styles/T/Spaces.yml: |
    extends: existence
    message: "double space in '%s'"
    level: warning
    nonword: true
    tokens:
      - '\S {2,}\S'
  styles/T/Indent.yml: |
    extends: existence
    message: "indent nested text three spaces"
    level: error
    nonword: true
    scope: raw
    tokens:
      - '^1\. [^\n]*\n( |  |    )[\w-]'
  styles/T/Terms.yml: |
    extends: substitution
    message: "use '%s' instead of '%s'"
    level: error
    ignorecase: true
    swap:
      ' api': ' API'
      app router: App Router
  terms.md: |
    This is the public
    API of the library.

    Read about the App
    Router here.

    This is the public
    api of the library.

    Read about the app
    router here.
  indent.md: |
    1. A step that runs on to
       a second line.

    1. A step that is indented
      one space short.
  wrap.md: |
    One line: a team, for example Sales.

    Wrapped: a team, for
    example Sales.
  swap.md: |
    One line: we wait in order to see.

    Wrapped: we wait in order
    to see.
  spaces.md: |
    Two  words here.

cases:
  - name: existence and substitution
    args: --output=line wrap.md swap.md
    exit: 0
    want: |
      swap.md:1:19:T.Swap:use 'to' instead of 'in order to'
      swap.md:3:18:T.Swap:use 'to' instead of 'in order to'
      wrap.md:1:19:T.Phrase:found 'for example'
      wrap.md:3:18:T.Phrase:found 'for example'

  - name: a wrapped phrase already in the swap's form
    about: "the wrap is compared as a space: `App\\nRouter` is `App Router` (#1238)"
    args: --output=line terms.md
    exit: 1
    want: |
      terms.md:7:19:T.Terms:use ' API' instead of ' api'
      terms.md:10:16:T.Terms:use 'App Router' instead of 'app router'

  - name: a quantified space keeps its meaning
    about: "`{2,}` after a space quantifies the space; it is not a line wrap"
    args: --output=line spaces.md
    exit: 0
    want: |
      spaces.md:1:3:T.Spaces:double space in 'o  w'

  - name: a space beside punctuation keeps its meaning
    about: "an alternation of space counts must not match three spaces"
    args: --output=line indent.md
    exit: 1
    want: |
      indent.md:4:1:T.Indent:indent nested text three spaces

  - name: the message shows the phrase on one line
    args: --output=JSON wrap.md
    exit: 0
    contains: |
      "Message": "found 'for example'",
