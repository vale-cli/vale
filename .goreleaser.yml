env:
  - CGO_ENABLED=1

before:
  hooks:
    # The wasm archive carries the loader from the toolchain that built it.
    - sh -c 'mkdir -p bin && install -m 0644 "$(go env GOROOT)/lib/wasm/wasm_exec.js" bin/wasm_exec.js'

builds:
  - id: vale-darwin-amd64
    main: ./cmd/vale
    binary: vale
    goarch:
      - amd64
    goos:
      - darwin
    env:
      - CC=o64-clang
      - CXX=o64-clang++
    flags:
      - -trimpath

  - id: vale-darwin-arm64
    main: ./cmd/vale
    binary: vale
    goarch:
      - arm64
    goos:
      - darwin
    env:
      - CC=oa64-clang
      - CXX=oa64-clang++
    flags:
      - -trimpath

  - id: vale-linux-amd64
    main: ./cmd/vale
    binary: vale
    goarch:
      - amd64
    goos:
      - linux
    env:
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
    flags:
      - -trimpath

  - id: vale-linux-arm64
    main: ./cmd/vale
    binary: vale
    goarch:
      - arm64
    goos:
      - linux
    env:
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    flags:
      - -trimpath

  - id: vale-windows-amd64
    main: ./cmd/vale
    binary: vale
    goarch:
      - amd64
    goos:
      - windows
    env:
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    flags:
      - -trimpath
      - -buildmode=exe
    ldflags:
      - -s -w -X main.version={{.Version}}
      - -extldflags=-static

  # Windows on ARM builds with llvm-mingw rather than the mingw-w64 that the
  # amd64 target uses -- the latter has no aarch64 cross-compiler, and cgo
  # rules out building without one. `goreleaser-cross` keeps it here.
  - id: vale-windows-arm64
    main: ./cmd/vale
    binary: vale
    goarch:
      - arm64
    goos:
      - windows
    env:
      - CC=/llvm-mingw/bin/aarch64-w64-mingw32-gcc
      - CXX=/llvm-mingw/bin/aarch64-w64-mingw32-g++
    flags:
      - -trimpath
      - -buildmode=exe
    ldflags:
      - -s -w -X main.version={{.Version}}
      - -extldflags=-static

  # The browser build: a WebAssembly module for a JavaScript host, with no
  # CGo and so no tree-sitter or external converters. It ships beside the
  # loader that belongs to the Go toolchain that built it (see `before`).
  - id: vale-wasm
    main: ./cmd/valew
    binary: vale
    goarch:
      - wasm
    goos:
      - js
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: native
    builds:
      - vale-darwin-amd64
      - vale-darwin-arm64
      - vale-linux-amd64
      - vale-linux-arm64
      - vale-windows-amd64
      - vale-windows-arm64
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      vale_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS_
      {{- else }}{{- title .Os }}_{{ end }}
      {{- if eq .Arch "amd64" }}64-bit
      {{- else }}{{ .Arch }}{{ end }}

  - id: wasm
    builds:
      - vale-wasm
    format: tar.gz
    name_template: vale_{{ .Version }}_wasm
    files:
      - src: bin/wasm_exec.js
        dst: wasm_exec.js

# Create the GitHub release as a draft and upload assets to it *before* it's
# published. A published release is immutable and rejects new assets ("422
# Cannot upload assets to an immutable release"), so assets must be attached
# while it's still a draft; publish it from the UI once GoReleaser finishes.
release:
  draft: true

chocolateys:
  - # Your app's package name.
    # The value may not contain spaces or character that are not valid for a URL.
    # If you want a good separator for words, use '-', not  '.'.
    #
    # Defaults to `ProjectName`.
    name: Vale

    # IDs of the archives to use.
    # Defaults to empty, which includes all artifacts.
    # ids:
    #   - vale

    # Your app's owner.
    # It basically means your.
    # Defaults empty.
    owners: Joseph Kato

    # The app's title.
    # A human-friendly title of the package.
    # Defaults to `ProjectName`.
    title: Vale

    # Your app's authors (probably you).
    # Defaults are shown below.
    authors: Joseph Kato

    # Your app's project url.
    # It is a required field.
    project_url: https://github.com/vale-cli/vale

    # Template for the url which is determined by the given Token (github,
    # gitlab or gitea)
    # Default depends on the client.
    #
    # https://github.com/vale-cli/vale/releases/download/v2.21.0/vale_2.21.0_Windows_64-bit.zip
    url_template: "https://github.com/vale-cli/vale/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    # App's icon.
    # Default is empty.
    icon_url: https://github.com/vale-cli.png

    # Your app's copyright details.
    # Default is empty.
    copyright: © Joseph Kato

    # App's license information url.
    license_url: https://github.com/vale-cli/vale/blob/v3/LICENSE

    # Your apps's require license acceptance:
    # Specify whether the client must prompt the consumer to accept the package
    # license before installing.
    # Default is false.
    require_license_acceptance: false

    # Your app's source url.
    # Default is empty.
    project_source_url: https://github.com/vale-cli/install/tree/main/pkg/chocolatey

    # Your app's documentation url.
    # Default is empty.
    docs_url: https://vale.sh/

    # App's bugtracker url.
    # Default is empty.
    bug_tracker_url: https://github.com/vale-cli/vale/issues

    # Your app's tag list.
    # Default is empty.
    tags: "vale linter prose admin"

    # Your app's summary:
    summary: Vale — the customizable linter for prose.

    # This the description of your chocolatey package.
    # Supports markdown.
    description: |
      Vale is a free, open-source linter for prose built with speed and
      extensibility in mind.

    # Your app's release notes.
    # A description of the changes made in this release of the package.
    # Supports markdown. To prevent the need to continually update this field,
    # providing a URL to an external list of Release Notes is perfectly
    # acceptable.
    # Default is empty.
    release_notes: "https://github.com/vale-cli/vale/releases/tag/v{{ .Version }}"

    # The api key that should be used to push to the chocolatey repository.
    #
    # WARNING: do not expose your api key in the configuration file!
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"

    # The source repository that will push the package to.
    #
    # Defaults are shown below.
    source_repo: "https://push.chocolatey.org/"

    # Setting this will prevent goreleaser to actually try to push the package
    # to chocolatey repository, leaving the responsability of publishing it to
    # the user.
    skip_publish: false
