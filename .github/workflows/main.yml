name: Build + Lint

on: push

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup release environment
        run: |-
          echo 'GITHUB_TOKEN=${{secrets.GITHUB_TOKEN}}' > .release-env
          echo 'CHOCOLATEY_API_KEY=${{secrets.CHOCOLATEY_API_KEY}}' >> .release-env

      - uses: mlugg/setup-zig@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          version: 0.16.0

      - name: Install binaryen
        if: startsWith(github.ref, 'refs/tags/')
        run: grammars/setup-binaryen.sh

      - name: Build the grammars
        if: startsWith(github.ref, 'refs/tags/')
        run: grammars/build.sh && grammars/pack.sh

      - name: GoReleaser
        run: make choco-cross
        if: startsWith(github.ref, 'refs/tags/')

      # The docs pin their install examples to the current release; this
      # tells the site to move them. DOCS_DISPATCH_TOKEN is a fine-grained
      # token with contents: write on vale-cli/vale.sh.
      - name: Release the docs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |-
          gh api repos/vale-cli/vale.sh/dispatches \
            -f event_type=vale-release \
            -F 'client_payload[version]=${{ github.ref_name }}'

      # A blog post written for this release (`release:` in its front
      # matter) leads the draft's notes with its banner, title, and summary.
      - name: Link the release post
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |-
          site="$RUNNER_TEMP/vale.sh"
          git clone --quiet --depth 1 --branch svelte https://github.com/vale-cli/vale.sh "$site"
          header=$(node "$site/script/release-post.mjs" --notes "$TAG")
          if [ -z "$header" ]; then
            echo "no post for $TAG"
            exit 0
          fi
          body=$(gh release view "$TAG" --json body --jq .body)
          printf '%s\n\n%s\n' "$header" "$body" | gh release edit "$TAG" --notes-file -

  lint:
    name: runner / vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vale-cli/vale-action@v2.1.1
        with:
          files: README.md
          debug: true
          fail_on_error: true
          reporter: github-check
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
