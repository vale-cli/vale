name: Build + Lint

on: push

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"

      - name: Setup release environment
        run: |-
          echo 'GITHUB_TOKEN=${{secrets.GITHUB_TOKEN}}' > .release-env
          echo 'CHOCOLATEY_API_KEY=${{secrets.CHOCOLATEY_API_KEY}}' >> .release-env

      - name: GoReleaser
        run: make choco-cross
        if: startsWith(github.ref, 'refs/tags/')

      # The docs pin their install examples to the current release; this
      # tells the site to move them. DOCS_DISPATCH_TOKEN is a fine-grained
      # token with contents: write on vale-cli/vale.sh.
      - name: Release the docs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |-
          gh api repos/vale-cli/vale.sh/dispatches \
            -f event_type=vale-release \
            -F 'client_payload[version]=${{ github.ref_name }}'

  lint:
    name: runner / vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vale-cli/vale-action@v2.1.1
        with:
          files: README.md
          debug: true
          fail_on_error: true
          reporter: github-check
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
