# Point new pull requests at the contributing guide.
#
# `pull_request_target` runs with the base branch's permissions so the
# comment works for forks; the PR's code is never checked out here.
name: contributing

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  comment:
    if: ${{ !contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const guide = 'https://github.com/vale-cli/vale/blob/v3/.github/CONTRIBUTING.md#ai-assisted-contributions';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Before this is reviewed, please read the',
                `[AI-Assisted Contributions](${guide}) section of the contributing guide`,
                'and make sure this change meets it: you can explain every line, the',
                'description is your own and brief, it fixes a bug you hit or a feature',
                'agreed in an issue, it does not touch undocumented options, and any',
                'substantial tool use is noted.',
              ].join(' '),
            });
