name: Docker

# A tag publishes the image; a pull request that touches what the image is
# built from only builds it.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - .github/workflows/docker.yml

permissions:
  contents: read

env:
  IMAGE: jdkato/vale

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The final stage runs `apk` for each platform.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke
          build-args: ltag=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A misspelling in a Typst file has to come back as an alert: the
      # binary reads Typst on its own.
      - name: Smoke test
        run: |
          mkdir smoke
          printf 'MinAlertLevel = error\n\n[*]\nBasedOnStyles = Vale\n' > smoke/.vale.ini
          printf '= Heading\n\nThis sentence has a mispelling.\n' > smoke/doc.typ
          docker run --rm -v "$PWD/smoke:/work" -w /work "$IMAGE:smoke" \
            --output=line doc.typ | tee smoke/out.txt || true
          grep -q 'Vale.Spelling' smoke/out.txt
          docker run --rm --entrypoint xsltproc "$IMAGE:smoke" --version

      - name: Build every platform
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: ltag=${{ github.ref_name }}
          cache-from: type=gha

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ vars.DOCKER_USER || 'jdkato' }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: ltag=${{ github.ref_name }}
          cache-from: type=gha
